<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 875" width="100%" role="img" aria-label="The contract spine. Zod is the source: what is generated is gated, what is hand-kept is marked."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}@media (prefers-color-scheme:dark){.teal-f{fill:#16302c;stroke:#4fb3a3}.teal-o{stroke:#4fb3a3}.teal-t{fill:#82d6c6}.purple-f{fill:#221f38;stroke:#8b7dd0}.purple-o{stroke:#8b7dd0}.purple-t{fill:#ada0e4}.coral-f{fill:#35211b;stroke:#e08a6c}.coral-o{stroke:#e08a6c}.coral-t{fill:#f2ab8e}.gray-f{fill:#232220;stroke:#57534e}.gray-o{stroke:#57534e}.gray-t{fill:#a8a29b}.ink{fill:#ededea}.mute{fill:#a8a29b}.rule{stroke:#3a3835}}[data-theme=dark] .teal-f{fill:#16302c;stroke:#4fb3a3}[data-theme=dark] .teal-o{stroke:#4fb3a3}[data-theme=dark] .teal-t{fill:#82d6c6}[data-theme=dark] .purple-f{fill:#221f38;stroke:#8b7dd0}[data-theme=dark] .purple-o{stroke:#8b7dd0}[data-theme=dark] .purple-t{fill:#ada0e4}[data-theme=dark] .coral-f{fill:#35211b;stroke:#e08a6c}[data-theme=dark] .coral-o{stroke:#e08a6c}[data-theme=dark] .coral-t{fill:#f2ab8e}[data-theme=dark] .gray-f{fill:#232220;stroke:#57534e}[data-theme=dark] .gray-o{stroke:#57534e}[data-theme=dark] .gray-t{fill:#a8a29b}[data-theme=dark] .ink{fill:#ededea}[data-theme=dark] .mute{fill:#a8a29b}[data-theme=dark] .rule{stroke:#3a3835}[data-theme=light] .teal-f{fill:#e8f5f0;stroke:#2d9184}[data-theme=light] .teal-o{stroke:#2d9184}[data-theme=light] .teal-t{fill:#1f6f65}[data-theme=light] .purple-f{fill:#eeeafa;stroke:#6b5bb5}[data-theme=light] .purple-o{stroke:#6b5bb5}[data-theme=light] .purple-t{fill:#4a3f8a}[data-theme=light] .coral-f{fill:#fdeeea;stroke:#d4674a}[data-theme=light] .coral-o{stroke:#d4674a}[data-theme=light] .coral-t{fill:#a84a30}[data-theme=light] .gray-f{fill:#f4f3f1;stroke:#b0aca6}[data-theme=light] .gray-o{stroke:#b0aca6}[data-theme=light] .gray-t{fill:#6b6660}[data-theme=light] .ink{fill:#1a1a1a}[data-theme=light] .mute{fill:#6b6660}[data-theme=light] .rule{stroke:#ddd9d4}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#2d9184" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#6b5bb5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#d4674a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#b0aca6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><text x="28" y="22" font-size="9.5" fill="#6b6660" letter-spacing="1.1" class="mute">DIAGRAM 04</text><text x="28" y="44" font-size="18" fill="#1a1a1a" font-weight="500" class="ink">The contract spine</text><text x="28" y="61" font-size="12" fill="#6b6660" class="mute">Zod is the source: what is generated is gated, what is hand-kept is marked.</text><text x="28" y="96" font-size="12" fill="#6b6660" class="mute">One source, written by hand</text><rect x="28" y="106" width="624" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="130" font-size="14" fill="#1f6f65" class="teal-t">contracts/types</text><text x="46" y="149" font-size="12" fill="#1f6f65" opacity="0.74" class="teal-t">52 Zod source files; the registry sorts them into five tiers</text><text x="634" y="130" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">48 in SCHEMA_REGISTRY</text><line x1="340" y1="162" x2="340" y2="184" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="150" y="186" width="380" height="48" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="340" y="206" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">generate-json-schemas.ts</text><text x="340" y="223" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">Regenerated and deep-diffed by R22, blocking in CI</text><line x1="340" y1="236" x2="340" y2="256" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><text x="28" y="272" font-size="12" fill="#6b6660" class="mute">What the source reaches</text><rect x="28" y="282" width="624" height="32" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="303" font-size="14" fill="#1f6f65" class="teal-t">JSON Schema</text><text x="634" y="303" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.74" class="teal-t">48 generated, drift blocks CI</text><rect x="28" y="320" width="624" height="32" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="341" font-size="14" fill="#1f6f65" class="teal-t">TypeScript types</text><text x="634" y="341" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.74" class="teal-t">Inferred from the source, typechecked in CI</text><rect x="28" y="358" width="624" height="32" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="379" font-size="14" fill="#1f6f65" class="teal-t">Contract examples</text><text x="634" y="379" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.74" class="teal-t">27 checked with safeParse on every verify-all</text><rect x="28" y="396" width="624" height="32" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="417" font-size="14" fill="#1f6f65" class="teal-t">Registry and catalog</text><text x="634" y="417" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.74" class="teal-t">Generated; R32 fails when either is stale</text><rect x="28" y="434" width="624" height="32" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" class="coral-f"/><text x="46" y="455" font-size="14" fill="#a84a30" class="coral-t">Per-agent I/O schemas</text><text x="634" y="455" font-size="12" fill="#a84a30" text-anchor="end" opacity="0.74" class="coral-t">46 hand-kept JSON files</text><rect x="28" y="472" width="624" height="32" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" class="coral-f"/><text x="46" y="493" font-size="14" fill="#a84a30" class="coral-t">Database columns</text><text x="634" y="493" font-size="12" fill="#a84a30" text-anchor="end" opacity="0.74" class="coral-t">Hand-written migrations, parity advisory</text><rect x="28" y="512" width="13" height="13" rx="3" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="49" y="522" font-size="12" fill="#6b6660" class="mute">Generated or gated in CI</text><rect x="278" y="512" width="13" height="13" rx="3" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" class="coral-f"/><text x="299" y="522" font-size="12" fill="#6b6660" class="mute">Kept by hand, can drift</text><text x="28" y="546" font-size="12" fill="#6b6660" class="mute">At the agent boundary, and before any build</text><rect x="28" y="556" width="300" height="62" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="44" y="578" font-size="14" fill="#a84a30" class="coral-t">HandoffEnvelopeSchema</text><text x="44" y="596" font-size="12" fill="#a84a30" opacity="0.74" class="coral-t">safeParse on each emitted payload,</text><text x="44" y="611" font-size="12" fill="#a84a30" opacity="0.74" class="coral-t">before anything downstream reads it</text><rect x="352" y="556" width="300" height="62" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="368" y="578" font-size="14" fill="#a84a30" class="coral-t">contract-compiler.ts · R31</text><text x="368" y="596" font-size="12" fill="#a84a30" opacity="0.74" class="coral-t">Consumer reads checked by subtyping</text><text x="368" y="611" font-size="12" fill="#a84a30" opacity="0.74" class="coral-t">on 23 edges, blocking in CI</text><text x="28" y="644" font-size="12" fill="#6b6660" class="mute">Change impact</text><rect x="28" y="654" width="624" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="677" font-size="14" fill="#1f6f65" class="teal-t">blast-radius.ts</text><text x="46" y="695" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Walks 48 schemas and 32 traced prompts; run by hand</text><line x1="535" y1="682" x2="589" y2="662" stroke="#2d9184" stroke-width="0.5" opacity="0.3" class="teal-o"/><circle cx="592" cy="662" r="2.8" fill="#2d9184" opacity="0.6" class="teal-f"/><line x1="535" y1="682" x2="589" y2="672" stroke="#2d9184" stroke-width="0.5" opacity="0.3" class="teal-o"/><circle cx="592" cy="672" r="2.8" fill="#2d9184" opacity="0.6" class="teal-f"/><line x1="535" y1="682" x2="589" y2="682" stroke="#2d9184" stroke-width="0.5" opacity="0.3" class="teal-o"/><circle cx="592" cy="682" r="2.8" fill="#2d9184" opacity="0.6" class="teal-f"/><line x1="535" y1="682" x2="589" y2="692" stroke="#2d9184" stroke-width="0.5" opacity="0.3" class="teal-o"/><circle cx="592" cy="692" r="2.8" fill="#2d9184" opacity="0.6" class="teal-f"/><line x1="535" y1="682" x2="589" y2="702" stroke="#2d9184" stroke-width="0.5" opacity="0.3" class="teal-o"/><circle cx="592" cy="702" r="2.8" fill="#2d9184" opacity="0.6" class="teal-f"/><circle cx="532" cy="682" r="2.8" fill="#2d9184" opacity="0.6" class="teal-f"/><line x1="28" y1="736" x2="652" y2="736" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="753" font-size="10" fill="#6b6660" class="mute">JSON Schema, the contract registry and its catalog are generated from the Zod source, and CI blocks on</text><text x="28" y="766" font-size="10" fill="#6b6660" class="mute">any difference; types come from the same source by inference. What is kept by hand is drawn in coral</text><text x="28" y="779" font-size="10" fill="#6b6660" class="mute">because it can drift. Each emitted handoff is parsed against its boundary schema, and in CI</text><text x="28" y="792" font-size="10" fill="#6b6660" class="mute">contract-compiler.ts checks each consumer's declared reads against its producer's schema; five of its</text><text x="28" y="805" font-size="10" fill="#6b6660" class="mute">twenty-three edges declare typed reads so far. The frontier beside blast-radius.ts is the widest the</text><text x="28" y="818" font-size="10" fill="#6b6660" class="mute">registry holds: one schema with five importers.</text><text x="28" y="835" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - generate-json-schemas.ts and contracts-vs-json-schema.ts (R22), generate-registry.ts</text><text x="28" y="848" font-size="10" fill="#6b6660" opacity="0.72" class="mute">(R32), contract-compiler.ts and edge-registry.ts (R31), HandoffEnvelopeSchema; blast-radius.ts run by</text><text x="28" y="861" font-size="10" fill="#6b6660" opacity="0.72" class="mute">hand</text></svg>