<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 965" width="100%" role="img" aria-label="The contract spine. Zod is the source: what is generated is gated, what is hand-kept is marked."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}text.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Mono','Segoe UI Mono','DejaVu Sans Mono','Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@media (prefers-color-scheme:dark){.teal-f{fill:#122925;stroke:#61c2b2}.teal-o{stroke:#61c2b2}.teal-t{fill:#bee8e0}.teal-m{fill:#61c2b2}.teal-h{stroke:#32a091}.purple-f{fill:#242232;stroke:#ada4e6}.purple-o{stroke:#ada4e6}.purple-t{fill:#dddafb}.purple-m{fill:#ada4e6}.purple-h{stroke:#8b81c5}.coral-f{fill:#311f19;stroke:#e39982}.coral-o{stroke:#e39982}.coral-t{fill:#fad5c9}.coral-m{fill:#e39982}.coral-h{stroke:#c0765f}.gray-f{fill:#262421;stroke:#b1ada8}.gray-o{stroke:#b1ada8}.gray-t{fill:#e1ddd8}.gray-m{fill:#b1ada8}.gray-h{stroke:#8f8b87}.surface{fill:#0d0b08}.ink{fill:#ebe7e2}.mute{fill:#dbd7d2}.rule{stroke:#5b5753}}[data-theme=dark] .teal-f{fill:#122925;stroke:#61c2b2}[data-theme=dark] .teal-o{stroke:#61c2b2}[data-theme=dark] .teal-t{fill:#bee8e0}[data-theme=dark] .teal-m{fill:#61c2b2}[data-theme=dark] .teal-h{stroke:#32a091}[data-theme=dark] .purple-f{fill:#242232;stroke:#ada4e6}[data-theme=dark] .purple-o{stroke:#ada4e6}[data-theme=dark] .purple-t{fill:#dddafb}[data-theme=dark] .purple-m{fill:#ada4e6}[data-theme=dark] .purple-h{stroke:#8b81c5}[data-theme=dark] .coral-f{fill:#311f19;stroke:#e39982}[data-theme=dark] .coral-o{stroke:#e39982}[data-theme=dark] .coral-t{fill:#fad5c9}[data-theme=dark] .coral-m{fill:#e39982}[data-theme=dark] .coral-h{stroke:#c0765f}[data-theme=dark] .gray-f{fill:#262421;stroke:#b1ada8}[data-theme=dark] .gray-o{stroke:#b1ada8}[data-theme=dark] .gray-t{fill:#e1ddd8}[data-theme=dark] .gray-m{fill:#b1ada8}[data-theme=dark] .gray-h{stroke:#8f8b87}[data-theme=dark] .surface{fill:#0d0b08}[data-theme=dark] .ink{fill:#ebe7e2}[data-theme=dark] .mute{fill:#dbd7d2}[data-theme=dark] .rule{stroke:#5b5753}[data-theme=light] .teal-f{fill:#dff4ef;stroke:#228c7e}[data-theme=light] .teal-o{stroke:#228c7e}[data-theme=light] .teal-t{fill:#0f5950}[data-theme=light] .teal-m{fill:#228c7e}[data-theme=light] .teal-h{stroke:#32a091}[data-theme=light] .purple-f{fill:#eeecfd;stroke:#7a70af}[data-theme=light] .purple-o{stroke:#7a70af}[data-theme=light] .purple-t{fill:#4d4671}[data-theme=light] .purple-m{fill:#7a70af}[data-theme=light] .purple-h{stroke:#8b81c5}[data-theme=light] .coral-f{fill:#fdeae4;stroke:#aa6550}[data-theme=light] .coral-o{stroke:#aa6550}[data-theme=light] .coral-t{fill:#6e3f30}[data-theme=light] .coral-m{fill:#aa6550}[data-theme=light] .coral-h{stroke:#c0765f}[data-theme=light] .gray-f{fill:#f2eee9;stroke:#7d7a75}[data-theme=light] .gray-o{stroke:#7d7a75}[data-theme=light] .gray-t{fill:#504c48}[data-theme=light] .gray-m{fill:#7d7a75}[data-theme=light] .gray-h{stroke:#8f8b87}[data-theme=light] .surface{fill:#ffffff}[data-theme=light] .ink{fill:#1d1a17}[data-theme=light] .mute{fill:#66635e}[data-theme=light] .rule{stroke:#c1bdb8}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#228c7e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7a70af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#aa6550" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7d7a75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><rect x="0" y="0" width="680" height="965" fill="#ffffff" class="surface"/><text x="28" y="24" font-size="12" fill="#66635e" letter-spacing="1.1" class="mute mono">DIAGRAM 04</text><text x="28" y="52" font-size="21" fill="#1d1a17" font-weight="600" class="ink">The contract spine</text><text x="28" y="73" font-size="14" fill="#66635e" class="mute">Zod is the source: what is generated is gated, what is hand-kept is marked.</text><text x="28" y="96" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">ONE SOURCE, WRITTEN BY HAND</text><rect x="28" y="106" width="624" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="130" font-size="14" fill="#0f5950" class="teal-t">contracts/types</text><text x="46" y="149" font-size="12" fill="#0f5950" class="teal-t">52 Zod source files; the registry sorts them into five tiers</text><text x="634" y="130" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">48 in SCHEMA_REGISTRY</text><line x1="340" y1="162" x2="340" y2="184" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="150" y="186" width="380" height="48" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="340" y="206" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">generate-json-schemas.ts</text><text x="340" y="223" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Regenerated and deep-diffed by R22, blocking in CI</text><line x1="340" y1="236" x2="340" y2="256" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><text x="28" y="272" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">WHAT THE SOURCE REACHES</text><rect x="28" y="282" width="624" height="32" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="303" font-size="14" fill="#0f5950" class="teal-t">JSON Schema</text><text x="634" y="303" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">48 generated, drift blocks CI</text><rect x="28" y="320" width="624" height="32" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="341" font-size="14" fill="#0f5950" class="teal-t">TypeScript types</text><text x="634" y="341" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">Inferred from the source, typechecked in CI</text><rect x="28" y="358" width="624" height="32" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="379" font-size="14" fill="#0f5950" class="teal-t">Contract examples</text><text x="634" y="379" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">27 checked with safeParse on every verify-all</text><rect x="28" y="396" width="624" height="32" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="417" font-size="14" fill="#0f5950" class="teal-t">Registry and catalog</text><text x="634" y="417" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">Generated; R32 fails when either is stale</text><rect x="28" y="434" width="624" height="32" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="46" y="455" font-size="14" fill="#6e3f30" class="coral-t">Per-agent I/O schemas</text><text x="634" y="455" font-size="12" fill="#6e3f30" text-anchor="end" class="coral-t">46 hand-kept JSON files</text><rect x="28" y="472" width="624" height="32" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="46" y="493" font-size="14" fill="#6e3f30" class="coral-t">Database columns</text><text x="634" y="493" font-size="12" fill="#6e3f30" text-anchor="end" class="coral-t">Hand-written migrations, parity advisory</text><rect x="28" y="512" width="13" height="13" rx="3" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="49" y="522" font-size="12" fill="#66635e" class="mute">Generated or gated in CI</text><rect x="278" y="512" width="13" height="13" rx="3" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="299" y="522" font-size="12" fill="#66635e" class="mute">Kept by hand, can drift</text><text x="28" y="546" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">AT THE AGENT BOUNDARY, AND BEFORE ANY BUILD</text><rect x="28" y="556" width="300" height="62" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="44" y="578" font-size="14" fill="#6e3f30" class="coral-t">HandoffEnvelopeSchema</text><text x="44" y="596" font-size="12" fill="#6e3f30" class="coral-t">safeParse on each emitted payload,</text><text x="44" y="611" font-size="12" fill="#6e3f30" class="coral-t">before anything downstream reads it</text><rect x="352" y="556" width="300" height="62" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="368" y="578" font-size="14" fill="#6e3f30" class="coral-t">contract-compiler.ts · R31</text><text x="368" y="596" font-size="12" fill="#6e3f30" class="coral-t">Consumer reads checked by subtyping</text><text x="368" y="611" font-size="12" fill="#6e3f30" class="coral-t">on 23 edges, blocking in CI</text><text x="28" y="644" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">CHANGE IMPACT</text><rect x="28" y="654" width="624" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="677" font-size="14" fill="#0f5950" class="teal-t">blast-radius.ts</text><text x="46" y="695" font-size="12" fill="#0f5950" class="teal-t">Walks 48 schemas and 32 traced prompts; run by hand</text><line x1="535" y1="682" x2="589" y2="662" stroke="#32a091" stroke-width="0.75" class="teal-h"/><circle cx="592" cy="662" r="2.8" fill="#228c7e" class="teal-m"/><line x1="535" y1="682" x2="589" y2="672" stroke="#32a091" stroke-width="0.75" class="teal-h"/><circle cx="592" cy="672" r="2.8" fill="#228c7e" class="teal-m"/><line x1="535" y1="682" x2="589" y2="682" stroke="#32a091" stroke-width="0.75" class="teal-h"/><circle cx="592" cy="682" r="2.8" fill="#228c7e" class="teal-m"/><line x1="535" y1="682" x2="589" y2="692" stroke="#32a091" stroke-width="0.75" class="teal-h"/><circle cx="592" cy="692" r="2.8" fill="#228c7e" class="teal-m"/><line x1="535" y1="682" x2="589" y2="702" stroke="#32a091" stroke-width="0.75" class="teal-h"/><circle cx="592" cy="702" r="2.8" fill="#228c7e" class="teal-m"/><circle cx="532" cy="682" r="2.8" fill="#228c7e" class="teal-m"/><line x1="28" y1="736" x2="652" y2="736" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="756" font-size="12" fill="#66635e" class="mute">JSON Schema, the contract registry and its catalog are generated from the Zod</text><text x="28" y="774" font-size="12" fill="#66635e" class="mute">source, and CI blocks on any difference; types come from the same source by</text><text x="28" y="792" font-size="12" fill="#66635e" class="mute">inference. What is kept by hand is drawn in coral because it can drift. Each</text><text x="28" y="810" font-size="12" fill="#66635e" class="mute">emitted handoff is parsed against its boundary schema, and in CI</text><text x="28" y="828" font-size="12" fill="#66635e" class="mute">contract-compiler.ts checks each consumer's declared reads against its producer's</text><text x="28" y="846" font-size="12" fill="#66635e" class="mute">schema; five of its twenty-three edges declare typed reads so far. The frontier</text><text x="28" y="864" font-size="12" fill="#66635e" class="mute">beside blast-radius.ts is the widest the registry holds: one schema with five</text><text x="28" y="882" font-size="12" fill="#66635e" class="mute">importers.</text><text x="28" y="910" font-size="12" fill="#66635e" class="mute">Evidence: shipped - generate-json-schemas.ts and contracts-vs-json-schema.ts</text><text x="28" y="928" font-size="12" fill="#66635e" class="mute">(R22), generate-registry.ts (R32), contract-compiler.ts and edge-registry.ts</text><text x="28" y="946" font-size="12" fill="#66635e" class="mute">(R31), HandoffEnvelopeSchema; blast-radius.ts run by hand</text></svg>