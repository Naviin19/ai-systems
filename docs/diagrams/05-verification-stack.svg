ata-theme=dark] .ink{fill:#ebe7e2}[data-theme=dark] .mute{fill:#dbd7d2}[data-theme=dark] .rule{stroke:#5b5753}[data-theme=light] .teal-f{fill:#dff4ef;stroke:#228c7e}[data-theme=light] .teal-o{stroke:#228c7e}[data-theme=light] .teal-t{fill:#0f5950}[data-theme=light] .teal-m{fill:#228c7e}[data-theme=light] .teal-h{stroke:#32a091}[data-theme=light] .purple-f{fill:#eeecfd;stroke:#7a70af}[data-theme=light] .purple-o{stroke:#7a70af}[data-theme=light] .purple-t{fill:#4d4671}[data-theme=light] .purple-m{fill:#7a70af}[data-theme=light] .purple-h{stroke:#8b81c5}[data-theme=light] .coral-f{fill:#fdeae4;stroke:#aa6550}[data-theme=light] .coral-o{stroke:#aa6550}[data-theme=light] .coral-t{fill:#6e3f30}[data-theme=light] .coral-m{fill:#aa6550}[data-theme=light] .coral-h{stroke:#c0765f}[data-theme=light] .gray-f{fill:#f2eee9;stroke:#7d7a75}[data-theme=light] .gray-o{stroke:#7d7a75}[data-theme=light] .gray-t{fill:#504c48}[data-theme=light] .gray-m{fill:#7d7a75}[data-theme=light] .gray-h{stroke:#8f8b87}[data-theme=light] .surface{fill:#ffffff}[data-theme=light] .ink{fill:#1d1a17}[data-theme=light] .mute{fill:#66635e}[data-theme=light] .rule{stroke:#c1bdb8}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#228c7e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7a70af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#aa6550" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7d7a75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><rect x="0" y="0" width="680" height="1053" fill="#ffffff" class="surface"/><text x="28" y="24" font-size="12" fill="#66635e" letter-spacing="1.1" class="mute mono">DIAGRAM 05</text><text x="28" y="52" font-size="21" fill="#1d1a17" font-weight="600" class="ink">The verification stack</text><text x="28" y="73" font-size="14" fill="#66635e" class="mute">Four outcomes; only a failure inside the route-back loop is classified.</text><text x="300" y="100" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Re-dispatched to the same agent with the failure as ROLLBACK_CONTEXT</text><path d="M561.0,196 L561.0,110 L40,110 L40,134 L60,134" fill="none" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-coral)" class="coral-o"/><rect x="64" y="118" width="380" height="32" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="82" y="139.04" font-size="14" fill="#504c48" font-weight="500" class="gray-t">Agent output</text><text x="426" y="139.04" font-size="12" fill="#504c48" text-anchor="end" font-weight="500" class="gray-t">emit_handoff, or an emit script</text><line x1="254.0" y1="150" x2="254.0" y2="158" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="160" width="380" height="28" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="82" y="179.04" font-size="14" fill="#6e3f30" font-weight="500" class="coral-t">Evidence committed</text><text x="426" y="179.04" font-size="12" fill="#6e3f30" text-anchor="end" font-weight="500" class="coral-t">SHA-256, before any gate</text><line x1="254.0" y1="188" x2="254.0" y2="194" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="196" width="380" height="36" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="82" y="210.04" font-size="14" fill="#0f5950" font-weight="500" class="teal-t">Quality gates</text><text x="82" y="227.04" font-size="12" fill="#0f5950" class="teal-t">Per-agent commands, such as tsc</text><text x="426" y="210.04" font-size="12" fill="#0f5950" text-anchor="end" font-weight="500" class="teal-t">routes back</text><rect x="64" y="244" width="380" height="36" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="82" y="258.04" font-size="14" fill="#0f5950" font-weight="500" class="teal-t">Schema on write</text><text x="82" y="275.04" font-size="12" fill="#0f5950" class="teal-t">HandoffEnvelopeSchema.safeParse</text><text x="426" y="258.04" font-size="12" fill="#0f5950" text-anchor="end" font-weight="500" class="teal-t">routes back</text><line x1="254.0" y1="238" x2="254.0" y2="243" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="292" width="380" height="36" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="82" y="306.04" font-size="14" fill="#0f5950" font-weight="500" class="teal-t">D3 absorption</text><text x="82" y="323.04" font-size="12" fill="#0f5950" class="teal-t">When absorption is declared</text><text x="426" y="306.04" font-size="12" fill="#0f5950" text-anchor="end" font-weight="500" class="teal-t">routes back</text><line x1="254.0" y1="286" x2="254.0" y2="291" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="340" width="380" height="36" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="82" y="354.04" font-size="14" fill="#6e3f30" font-weight="500" class="coral-t">Commitment verified</text><text x="82" y="371.04" font-size="12" fill="#6e3f30" class="coral-t">The evidence has not moved</text><text x="426" y="354.04" font-size="12" fill="#6e3f30" text-anchor="end" font-weight="500" class="coral-t">halts on mismatch</text><line x1="254.0" y1="334" x2="254.0" y2="339" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="388" width="380" height="36" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="82" y="402.04" font-size="14" fill="#0f5950" font-weight="500" class="teal-t">Faithfulness judge</text><text x="82" y="419.04" font-size="12" fill="#0f5950" class="teal-t">Markdown against JSON, 0 to 10</text><text x="426" y="402.04" font-size="12" fill="#0f5950" text-anchor="end" font-weight="500" class="teal-t">warns; halts at A, B</text><line x1="254.0" y1="382" x2="254.0" y2="387" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="436" width="380" height="36" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="82" y="450.04" font-size="14" fill="#0f5950" font-weight="500" class="teal-t">R24, drift, release gate</text><text x="82" y="467.04" font-size="12" fill="#0f5950" class="teal-t">Contradictions, semantic drift, release</text><text x="426" y="450.04" font-size="12" fill="#0f5950" text-anchor="end" font-weight="500" class="teal-t">warn or halt</text><line x1="254.0" y1="430" x2="254.0" y2="435" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="484" width="380" height="36" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="82" y="498.04" font-size="14" fill="#6e3f30" font-weight="500" class="coral-t">Step attestation</text><text x="82" y="515.04" font-size="12" fill="#6e3f30" class="coral-t">Re-runs each step's verify against the claim</text><text x="426" y="498.04" font-size="12" fill="#6e3f30" text-anchor="end" font-weight="500" class="coral-t">halts</text><line x1="254.0" y1="478" x2="254.0" y2="483" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="254.0" y1="526" x2="254.0" y2="531" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="532" width="380" height="30" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="82" y="552.04" font-size="14" fill="#504c48" font-weight="500" class="gray-t">Merged to trunk</text><text x="426" y="552.04" font-size="12" fill="#504c48" text-anchor="end" font-weight="500" class="gray-t">under .merge.lock</text><line x1="254.0" y1="562" x2="254.0" y2="567" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="568" width="380" height="36" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="82" y="582.04" font-size="14" fill="#0f5950" font-weight="500" class="teal-t">Drift audit</text><text x="82" y="599.04" font-size="12" fill="#0f5950" class="teal-t">Every declared skill indexed in the prompt</text><text x="426" y="582.04" font-size="12" fill="#0f5950" text-anchor="end" font-weight="500" class="teal-t">halts, after the merge</text><line x1="444" y1="214" x2="452" y2="214" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="444" y1="262" x2="452" y2="262" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="444" y1="310" x2="452" y2="310" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="452" y1="214" x2="452" y2="310" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="452" y1="262" x2="468" y2="262" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-coral)" class="coral-o"/><rect x="470" y="196" width="182" height="120" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="561.0" y="218" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">classifyRouteBack</text><text x="561.0" y="236" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">3 retryable classes</text><text x="561.0" y="252" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">A-B-A oscillation cut</text><rect x="553.2" y="261" width="2.4" height="8" rx="0" fill="#aa6550" class="coral-m"/><rect x="559.8" y="261" width="2.4" height="8" rx="0" fill="#aa6550" class="coral-m"/><rect x="566.4" y="261" width="2.4" height="8" rx="0" fill="#aa6550" class="coral-m"/><text x="561.0" y="286" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">3 attempts in all</text><text x="561.0" y="303" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">needs an error heuristic</text><line x1="561.0" y1="316" x2="561.0" y2="614" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-coral)" class="coral-o"/><line x1="444" y1="358" x2="460" y2="358" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="444" y1="502" x2="460" y2="502" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="444" y1="586" x2="460" y2="586" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="444" y1="406" x2="460" y2="406" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="5 4" class="coral-o"/><line x1="444" y1="454" x2="460" y2="454" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="5 4" class="coral-o"/><line x1="460" y1="358" x2="460" y2="625" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="460" y1="625" x2="468" y2="625" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-coral)" class="coral-o"/><rect x="470" y="620" width="182" height="10" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="0.5" class="coral-f"/><text x="561.0" y="652" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Run halts</text><text x="561.0" y="669" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">No new agents start</text><text x="561.0" y="685" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Earlier merges stand</text><line x1="64" y1="406" x2="48" y2="406" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><line x1="64" y1="454" x2="48" y2="454" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" class="coral-o"/><path d="M48,406 L48,475 L62,475" fill="none" stroke="#aa6550" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-coral)" class="coral-o"/><line x1="30" y1="632" x2="41" y2="632" stroke="#aa6550" stroke-width="1.5" marker-end="url(#ar-coral)" class="coral-o"/><text x="49" y="636" font-size="12" fill="#66635e" class="mute">Route back: the failure is the next input, 3 attempts</text><line x1="30" y1="651" x2="41" y2="651" stroke="#aa6550" stroke-width="1.5" marker-end="url(#ar-coral)" class="coral-o"/><text x="49" y="655" font-size="12" fill="#66635e" class="mute">Warn: recorded, and the run continues</text><rect x="28" y="665" width="13" height="13" rx="3" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="49" y="675" font-size="12" fill="#66635e" class="mute">Halt: no new agents start</text><rect x="28" y="712" width="306" height="86" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="44" y="735" font-size="14" fill="#504c48" class="gray-t">Two judges, both calibrated</text><text x="44" y="754" font-size="12" fill="#504c48" class="gray-t">Faithfulness: 10 of 10 blocked</text><text x="44" y="770" font-size="12" fill="#504c48" class="gray-t">Cross-family, opt-in: 11 of 12</text><text x="44" y="786" font-size="12" fill="#504c48" class="gray-t">No clean handoff rejected, 14 Sep</text><rect x="346" y="712" width="306" height="86" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="362" y="735" font-size="14" fill="#504c48" class="gray-t">Drift is lexical, per agent</text><text x="362" y="754" font-size="12" fill="#504c48" class="gray-t">Trigram-hash embedder, floor 0.82</text><text x="362" y="770" font-size="12" fill="#504c48" class="gray-t">Halts once two baselines exist</text><text x="362" y="786" font-size="12" fill="#504c48" class="gray-t">Only agent 12 has two today</text><line x1="28" y1="824" x2="652" y2="824" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="844" font-size="12" fill="#66635e" class="mute">Direction encodes outcome: up and to the left returns, down terminates, straight</text><text x="28" y="862" font-size="12" fill="#66635e" class="mute">continues. Evidence is committed when an agent emits and verified before any judge</text><text x="28" y="880" font-size="12" fill="#66635e" class="mute">reads it; a producer's handoff is committed when the orchestrator first sees it.</text><text x="28" y="898" font-size="12" fill="#66635e" class="mute">Three failure classes route back with the failure as the next input, three</text><text x="28" y="916" font-size="12" fill="#66635e" class="mute">attempts in all, when an error heuristic matches: a quality gate such as tsc,</text><text x="28" y="934" font-size="12" fill="#66635e" class="mute">schema on write, and D3. Every later failure halts, the drift audit after the</text><text x="28" y="952" font-size="12" fill="#66635e" class="mute">agent's work has merged, and the faithfulness judge warns except at the two human</text><text x="28" y="970" font-size="12" fill="#66635e" class="mute">gates.</text><text x="28" y="998" font-size="12" fill="#66635e" class="mute">Evidence: shipped - master-agentic-orchestrator.ts, route-back.ts,</text><text x="28" y="1016" font-size="12" fill="#66635e" class="mute">evidence-commitment.ts, post-emit-checks.ts, semantic-drift.ts,</text><text x="28" y="1034" font-size="12" fill="#66635e" class="mute">attestation-verifier.ts, drift-audit.ts; calibration runs of 13 and 14 Sep</text></svg>