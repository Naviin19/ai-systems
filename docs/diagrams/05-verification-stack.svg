<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 862" width="100%" role="img" aria-label="The verification stack. Four outcomes, and a failure is classified before it is acted on."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}@media (prefers-color-scheme:dark){.teal-f{fill:#16302c;stroke:#4fb3a3}.teal-o{stroke:#4fb3a3}.teal-t{fill:#82d6c6}.purple-f{fill:#221f38;stroke:#8b7dd0}.purple-o{stroke:#8b7dd0}.purple-t{fill:#ada0e4}.coral-f{fill:#35211b;stroke:#e08a6c}.coral-o{stroke:#e08a6c}.coral-t{fill:#f2ab8e}.gray-f{fill:#232220;stroke:#57534e}.gray-o{stroke:#57534e}.gray-t{fill:#a8a29b}.ink{fill:#ededea}.mute{fill:#a8a29b}.rule{stroke:#3a3835}}[data-theme=dark] .teal-f{fill:#16302c;stroke:#4fb3a3}[data-theme=dark] .teal-o{stroke:#4fb3a3}[data-theme=dark] .teal-t{fill:#82d6c6}[data-theme=dark] .purple-f{fill:#221f38;stroke:#8b7dd0}[data-theme=dark] .purple-o{stroke:#8b7dd0}[data-theme=dark] .purple-t{fill:#ada0e4}[data-theme=dark] .coral-f{fill:#35211b;stroke:#e08a6c}[data-theme=dark] .coral-o{stroke:#e08a6c}[data-theme=dark] .coral-t{fill:#f2ab8e}[data-theme=dark] .gray-f{fill:#232220;stroke:#57534e}[data-theme=dark] .gray-o{stroke:#57534e}[data-theme=dark] .gray-t{fill:#a8a29b}[data-theme=dark] .ink{fill:#ededea}[data-theme=dark] .mute{fill:#a8a29b}[data-theme=dark] .rule{stroke:#3a3835}[data-theme=light] .teal-f{fill:#e8f5f0;stroke:#2d9184}[data-theme=light] .teal-o{stroke:#2d9184}[data-theme=light] .teal-t{fill:#1f6f65}[data-theme=light] .purple-f{fill:#eeeafa;stroke:#6b5bb5}[data-theme=light] .purple-o{stroke:#6b5bb5}[data-theme=light] .purple-t{fill:#4a3f8a}[data-theme=light] .coral-f{fill:#fdeeea;stroke:#d4674a}[data-theme=light] .coral-o{stroke:#d4674a}[data-theme=light] .coral-t{fill:#a84a30}[data-theme=light] .gray-f{fill:#f4f3f1;stroke:#b0aca6}[data-theme=light] .gray-o{stroke:#b0aca6}[data-theme=light] .gray-t{fill:#6b6660}[data-theme=light] .ink{fill:#1a1a1a}[data-theme=light] .mute{fill:#6b6660}[data-theme=light] .rule{stroke:#ddd9d4}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#2d9184" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#6b5bb5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#d4674a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#b0aca6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><text x="28" y="22" font-size="9.5" fill="#6b6660" letter-spacing="1.1" class="mute">DIAGRAM 05</text><text x="28" y="44" font-size="18" fill="#1a1a1a" font-weight="500" class="ink">The verification stack</text><text x="28" y="61" font-size="12" fill="#6b6660" class="mute">Four outcomes, and a failure is classified before it is acted on.</text><text x="300" y="100" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.8" class="coral-t">Re-dispatched to the same agent with the failure as ROLLBACK_CONTEXT</text><path d="M561.0,176 L561.0,112 L40,112 L40,139 L60,139" fill="none" stroke="#d4674a" stroke-width="1.5" opacity="0.85" marker-end="url(#ar-coral)" class="coral-o"/><rect x="64" y="122" width="380" height="34" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="82" y="144.0" font-size="14" fill="#6b6660" class="gray-t">Agent output</text><text x="426" y="144.0" font-size="12" fill="#6b6660" text-anchor="end" opacity="0.78" class="gray-t">forced emit_handoff call</text><line x1="254.0" y1="156" x2="254.0" y2="166" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="168" width="380" height="40" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="184.0" font-size="14" fill="#1f6f65" class="teal-t">Quality gates</text><text x="82" y="201.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Per-agent commands, such as tsc</text><text x="426" y="184.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">blocking</text><rect x="64" y="216" width="380" height="40" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="232.0" font-size="14" fill="#1f6f65" class="teal-t">Schema on write</text><text x="82" y="249.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">HandoffEnvelopeSchema.safeParse</text><text x="426" y="232.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">blocking</text><line x1="254.0" y1="208" x2="254.0" y2="214" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="264" width="380" height="40" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="280.0" font-size="14" fill="#1f6f65" class="teal-t">D3 absorption</text><text x="82" y="297.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Declared absorption must validate</text><text x="426" y="280.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">when declared</text><line x1="254.0" y1="256" x2="254.0" y2="262" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="312" width="380" height="40" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="328.0" font-size="14" fill="#1f6f65" class="teal-t">Faithfulness judge</text><text x="82" y="345.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Markdown against JSON, scored 0-10</text><text x="426" y="328.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">warns; halts at gates A, B</text><line x1="254.0" y1="304" x2="254.0" y2="310" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="360" width="380" height="40" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="376.0" font-size="14" fill="#1f6f65" class="teal-t">Step attestation</text><text x="82" y="393.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Re-runs each step's verify against the claim</text><text x="426" y="376.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">halts on mismatch</text><line x1="254.0" y1="352" x2="254.0" y2="358" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="408" width="380" height="40" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="424.0" font-size="14" fill="#1f6f65" class="teal-t">Drift audit</text><text x="82" y="441.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Every declared skill must be cited</text><text x="426" y="424.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">blocking</text><line x1="254.0" y1="400" x2="254.0" y2="406" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><line x1="254.0" y1="448" x2="254.0" y2="460" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="462" width="380" height="34" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="82" y="484.0" font-size="14" fill="#6b6660" class="gray-t">Merged to trunk</text><text x="426" y="484.0" font-size="12" fill="#6b6660" text-anchor="end" opacity="0.78" class="gray-t">under .merge.lock</text><line x1="444" y1="188" x2="452" y2="188" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="236" x2="452" y2="236" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="284" x2="452" y2="284" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="452" y1="188" x2="452" y2="284" stroke="#d4674a" stroke-width="1.5" opacity="0.6" class="coral-o"/><line x1="452" y1="236" x2="468" y2="236" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><rect x="470" y="176" width="182" height="120" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="561.0" y="198" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">classifyRouteBack</text><text x="561.0" y="216" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">3 retryable classes</text><text x="561.0" y="232" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">A-B-A oscillation cut</text><rect x="553.2" y="241" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><rect x="559.8" y="241" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><rect x="566.4" y="241" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><text x="561.0" y="266" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">3 attempts in all</text><text x="561.0" y="283" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.6" class="coral-t">then the run halts</text><line x1="561.0" y1="296" x2="561.0" y2="426" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><line x1="444" y1="332" x2="460" y2="332" stroke="#d4674a" stroke-width="1.5" opacity="0.65" stroke-dasharray="4 3" class="coral-o"/><line x1="444" y1="380" x2="460" y2="380" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="428" x2="460" y2="428" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="460" y1="332" x2="460" y2="433" stroke="#d4674a" stroke-width="1.5" opacity="0.6" class="coral-o"/><line x1="460" y1="433" x2="468" y2="433" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><rect x="470" y="428" width="182" height="10" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" class="coral-f"/><text x="561.0" y="460" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">Run halts</text><text x="561.0" y="477" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">This agent emits nothing</text><text x="561.0" y="493" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.6" class="coral-t">Earlier merges stand</text><path d="M64,332 L48,332 L48,356 L62,356" fill="none" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><line x1="30" y1="520" x2="41" y2="520" stroke="#d4674a" stroke-width="1.5" marker-end="url(#ar-coral)" class="coral-o"/><text x="49" y="524" font-size="12" fill="#6b6660" class="mute">Route back: the failure becomes the next input, 3 attempts in all</text><line x1="30" y1="539" x2="41" y2="539" stroke="#d4674a" stroke-width="1.5" marker-end="url(#ar-coral)" class="coral-o"/><text x="49" y="543" font-size="12" fill="#6b6660" class="mute">Warn: annotated, the run continues</text><rect x="28" y="553" width="13" height="13" rx="3" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" class="coral-f"/><text x="49" y="563" font-size="12" fill="#6b6660" class="mute">Halt: this agent emits nothing; earlier merges stand</text><rect x="28" y="580" width="624" height="70" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" stroke-dasharray="4 3" class="gray-f"/><text x="44" y="603" font-size="14" fill="#6b6660" class="gray-t">Opt-in: the cross-family judge</text><text x="636" y="603" font-size="12" fill="#6b6660" text-anchor="end" opacity="0.72" class="gray-t">PV_VERIFIER, 4 eligible agents</text><text x="44" y="622" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Evidence is hash-locked with SHA-256 before the judge reads it,</text><text x="44" y="638" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">then a non-Anthropic judge accepts or rejects; it warns by default</text><rect x="28" y="664" width="306" height="72" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="44" y="687" font-size="14" fill="#6b6660" class="gray-t">The judge was calibrated</text><text x="44" y="706" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">5 defect classes, catch 0.89, floor 0.70</text><text x="44" y="722" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">False reject 0.00, ceiling 0.10, 3 Aug</text><rect x="346" y="664" width="306" height="72" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="362" y="687" font-size="14" fill="#6b6660" class="gray-t">Drift is measured lexically</text><text x="362" y="706" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Trigram-hash embedder, cosine floor 0.82,</text><text x="362" y="722" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">advisory on agent 11's hardening rounds</text><line x1="28" y1="762" x2="652" y2="762" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="779" font-size="10" fill="#6b6660" class="mute">Direction encodes outcome: up and to the left returns, down terminates, straight continues. Three</text><text x="28" y="792" font-size="10" fill="#6b6660" class="mute">failure classes route back with the failure as the next input, three attempts in all: a quality gate</text><text x="28" y="805" font-size="10" fill="#6b6660" class="mute">such as tsc, schema on write, and D3. An attestation mismatch or a missing skill citation halts, and the</text><text x="28" y="818" font-size="10" fill="#6b6660" class="mute">faithfulness judge warns except at the two human gates, where it halts.</text><text x="28" y="835" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - master-agentic-orchestrator.ts, route-back.ts, post-emit-checks.ts,</text><text x="28" y="848" font-size="10" fill="#6b6660" opacity="0.72" class="mute">attestation-verifier.ts; evidence commitment on the opt-in judge path</text></svg>