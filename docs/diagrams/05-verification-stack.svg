<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 921" width="100%" role="img" aria-label="The verification stack. Four outcomes; only a failure inside the route-back loop is classified."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}@media (prefers-color-scheme:dark){.teal-f{fill:#16302c;stroke:#4fb3a3}.teal-o{stroke:#4fb3a3}.teal-t{fill:#82d6c6}.purple-f{fill:#221f38;stroke:#8b7dd0}.purple-o{stroke:#8b7dd0}.purple-t{fill:#ada0e4}.coral-f{fill:#35211b;stroke:#e08a6c}.coral-o{stroke:#e08a6c}.coral-t{fill:#f2ab8e}.gray-f{fill:#232220;stroke:#57534e}.gray-o{stroke:#57534e}.gray-t{fill:#a8a29b}.ink{fill:#ededea}.mute{fill:#a8a29b}.rule{stroke:#3a3835}}[data-theme=dark] .teal-f{fill:#16302c;stroke:#4fb3a3}[data-theme=dark] .teal-o{stroke:#4fb3a3}[data-theme=dark] .teal-t{fill:#82d6c6}[data-theme=dark] .purple-f{fill:#221f38;stroke:#8b7dd0}[data-theme=dark] .purple-o{stroke:#8b7dd0}[data-theme=dark] .purple-t{fill:#ada0e4}[data-theme=dark] .coral-f{fill:#35211b;stroke:#e08a6c}[data-theme=dark] .coral-o{stroke:#e08a6c}[data-theme=dark] .coral-t{fill:#f2ab8e}[data-theme=dark] .gray-f{fill:#232220;stroke:#57534e}[data-theme=dark] .gray-o{stroke:#57534e}[data-theme=dark] .gray-t{fill:#a8a29b}[data-theme=dark] .ink{fill:#ededea}[data-theme=dark] .mute{fill:#a8a29b}[data-theme=dark] .rule{stroke:#3a3835}[data-theme=light] .teal-f{fill:#e8f5f0;stroke:#2d9184}[data-theme=light] .teal-o{stroke:#2d9184}[data-theme=light] .teal-t{fill:#1f6f65}[data-theme=light] .purple-f{fill:#eeeafa;stroke:#6b5bb5}[data-theme=light] .purple-o{stroke:#6b5bb5}[data-theme=light] .purple-t{fill:#4a3f8a}[data-theme=light] .coral-f{fill:#fdeeea;stroke:#d4674a}[data-theme=light] .coral-o{stroke:#d4674a}[data-theme=light] .coral-t{fill:#a84a30}[data-theme=light] .gray-f{fill:#f4f3f1;stroke:#b0aca6}[data-theme=light] .gray-o{stroke:#b0aca6}[data-theme=light] .gray-t{fill:#6b6660}[data-theme=light] .ink{fill:#1a1a1a}[data-theme=light] .mute{fill:#6b6660}[data-theme=light] .rule{stroke:#ddd9d4}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#2d9184" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#6b5bb5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#d4674a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#b0aca6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><text x="28" y="22" font-size="9.5" fill="#6b6660" letter-spacing="1.1" class="mute">DIAGRAM 05</text><text x="28" y="44" font-size="18" fill="#1a1a1a" font-weight="500" class="ink">The verification stack</text><text x="28" y="61" font-size="12" fill="#6b6660" class="mute">Four outcomes; only a failure inside the route-back loop is classified.</text><text x="300" y="100" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.8" class="coral-t">Re-dispatched to the same agent with the failure as ROLLBACK_CONTEXT</text><path d="M561.0,196 L561.0,110 L40,110 L40,134 L60,134" fill="none" stroke="#d4674a" stroke-width="1.5" opacity="0.85" marker-end="url(#ar-coral)" class="coral-o"/><rect x="64" y="118" width="380" height="32" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="82" y="139.0" font-size="14" fill="#6b6660" class="gray-t">Agent output</text><text x="426" y="139.0" font-size="12" fill="#6b6660" text-anchor="end" opacity="0.78" class="gray-t">emit_handoff, or an emit script</text><line x1="254.0" y1="150" x2="254.0" y2="158" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="160" width="380" height="28" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="82" y="179.0" font-size="14" fill="#a84a30" class="coral-t">Evidence committed</text><text x="426" y="179.0" font-size="12" fill="#a84a30" text-anchor="end" opacity="0.78" class="coral-t">SHA-256, before any gate</text><line x1="254.0" y1="188" x2="254.0" y2="194" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="196" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="210.0" font-size="14" fill="#1f6f65" class="teal-t">Quality gates</text><text x="82" y="227.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Per-agent commands, such as tsc</text><text x="426" y="210.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">routes back</text><rect x="64" y="238" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="252.0" font-size="14" fill="#1f6f65" class="teal-t">Schema on write</text><text x="82" y="269.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">HandoffEnvelopeSchema.safeParse</text><text x="426" y="252.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">routes back</text><line x1="254.0" y1="232" x2="254.0" y2="237" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="280" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="294.0" font-size="14" fill="#1f6f65" class="teal-t">D3 absorption</text><text x="82" y="311.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">When absorption is declared</text><text x="426" y="294.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">routes back</text><line x1="254.0" y1="274" x2="254.0" y2="279" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="322" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="336.0" font-size="14" fill="#1f6f65" class="teal-t">Commitment verified</text><text x="82" y="353.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">The evidence has not moved</text><text x="426" y="336.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">halts on mismatch</text><line x1="254.0" y1="316" x2="254.0" y2="321" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="364" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="378.0" font-size="14" fill="#1f6f65" class="teal-t">Faithfulness judge</text><text x="82" y="395.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Markdown against JSON, 0 to 10</text><text x="426" y="378.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">warns; halts at A, B</text><line x1="254.0" y1="358" x2="254.0" y2="363" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="406" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="420.0" font-size="14" fill="#1f6f65" class="teal-t">R24, drift, release gate</text><text x="82" y="437.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Contradictions, semantic drift, release</text><text x="426" y="420.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">warn or halt</text><line x1="254.0" y1="400" x2="254.0" y2="405" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="448" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="462.0" font-size="14" fill="#1f6f65" class="teal-t">Step attestation</text><text x="82" y="479.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Re-runs each step's verify against the claim</text><text x="426" y="462.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">halts</text><line x1="254.0" y1="442" x2="254.0" y2="447" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><line x1="254.0" y1="484" x2="254.0" y2="489" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="490" width="380" height="30" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="82" y="510.0" font-size="14" fill="#6b6660" class="gray-t">Merged to trunk</text><text x="426" y="510.0" font-size="12" fill="#6b6660" text-anchor="end" opacity="0.78" class="gray-t">under .merge.lock</text><line x1="254.0" y1="520" x2="254.0" y2="525" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="64" y="526" width="380" height="36" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="82" y="540.0" font-size="14" fill="#1f6f65" class="teal-t">Drift audit</text><text x="82" y="557.0" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Every declared skill indexed in the prompt</text><text x="426" y="540.0" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">halts, after the merge</text><line x1="444" y1="214" x2="452" y2="214" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="256" x2="452" y2="256" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="298" x2="452" y2="298" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="452" y1="214" x2="452" y2="298" stroke="#d4674a" stroke-width="1.5" opacity="0.6" class="coral-o"/><line x1="452" y1="256" x2="468" y2="256" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><rect x="470" y="196" width="182" height="120" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="561.0" y="218" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">classifyRouteBack</text><text x="561.0" y="236" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">3 retryable classes</text><text x="561.0" y="252" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">A-B-A oscillation cut</text><rect x="553.2" y="261" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><rect x="559.8" y="261" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><rect x="566.4" y="261" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><text x="561.0" y="286" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">3 attempts in all</text><text x="561.0" y="303" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.6" class="coral-t">needs an error heuristic</text><line x1="561.0" y1="316" x2="561.0" y2="572" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><line x1="444" y1="340" x2="460" y2="340" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="466" x2="460" y2="466" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="544" x2="460" y2="544" stroke="#d4674a" stroke-width="1.5" opacity="0.75" class="coral-o"/><line x1="444" y1="382" x2="460" y2="382" stroke="#d4674a" stroke-width="1.5" opacity="0.65" stroke-dasharray="4 3" class="coral-o"/><line x1="444" y1="424" x2="460" y2="424" stroke="#d4674a" stroke-width="1.5" opacity="0.65" stroke-dasharray="4 3" class="coral-o"/><line x1="460" y1="340" x2="460" y2="583" stroke="#d4674a" stroke-width="1.5" opacity="0.6" class="coral-o"/><line x1="460" y1="583" x2="468" y2="583" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><rect x="470" y="578" width="182" height="10" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" class="coral-f"/><text x="561.0" y="610" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">Run halts</text><text x="561.0" y="627" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">No new agents start</text><text x="561.0" y="643" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.6" class="coral-t">Earlier merges stand</text><line x1="64" y1="382" x2="48" y2="382" stroke="#d4674a" stroke-width="1.5" opacity="0.8" class="coral-o"/><line x1="64" y1="424" x2="48" y2="424" stroke="#d4674a" stroke-width="1.5" opacity="0.8" class="coral-o"/><path d="M48,382 L48,445 L62,445" fill="none" stroke="#d4674a" stroke-width="1.5" opacity="0.8" marker-end="url(#ar-coral)" class="coral-o"/><line x1="30" y1="590" x2="41" y2="590" stroke="#d4674a" stroke-width="1.5" marker-end="url(#ar-coral)" class="coral-o"/><text x="49" y="594" font-size="12" fill="#6b6660" class="mute">Route back: the failure is the next input, 3 attempts</text><line x1="30" y1="609" x2="41" y2="609" stroke="#d4674a" stroke-width="1.5" marker-end="url(#ar-coral)" class="coral-o"/><text x="49" y="613" font-size="12" fill="#6b6660" class="mute">Warn: recorded, and the run continues</text><rect x="28" y="623" width="13" height="13" rx="3" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" class="coral-f"/><text x="49" y="633" font-size="12" fill="#6b6660" class="mute">Halt: no new agents start</text><rect x="28" y="670" width="306" height="86" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="44" y="693" font-size="14" fill="#6b6660" class="gray-t">Two judges, both calibrated</text><text x="44" y="712" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Faithfulness: 10 of 10 blocked</text><text x="44" y="728" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Cross-family, opt-in: 11 of 12</text><text x="44" y="744" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">No clean handoff rejected, 14 Sep</text><rect x="346" y="670" width="306" height="86" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="362" y="693" font-size="14" fill="#6b6660" class="gray-t">Drift is lexical, per agent</text><text x="362" y="712" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Trigram-hash embedder, floor 0.82</text><text x="362" y="728" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Halts once two baselines exist</text><text x="362" y="744" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Only agent 12 has two today</text><line x1="28" y1="782" x2="652" y2="782" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="799" font-size="10" fill="#6b6660" class="mute">Direction encodes outcome: up and to the left returns, down terminates, straight continues. Evidence is</text><text x="28" y="812" font-size="10" fill="#6b6660" class="mute">committed when an agent emits and verified before any judge reads it; a producer's handoff is committed</text><text x="28" y="825" font-size="10" fill="#6b6660" class="mute">when the orchestrator first sees it. Three failure classes route back with the failure as the next</text><text x="28" y="838" font-size="10" fill="#6b6660" class="mute">input, three attempts in all, when an error heuristic matches: a quality gate such as tsc, schema on</text><text x="28" y="851" font-size="10" fill="#6b6660" class="mute">write, and D3. Every later failure halts, the drift audit after the agent's work has merged, and the</text><text x="28" y="864" font-size="10" fill="#6b6660" class="mute">faithfulness judge warns except at the two human gates.</text><text x="28" y="881" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - master-agentic-orchestrator.ts, route-back.ts, evidence-commitment.ts,</text><text x="28" y="894" font-size="10" fill="#6b6660" opacity="0.72" class="mute">post-emit-checks.ts, semantic-drift.ts, attestation-verifier.ts, drift-audit.ts; calibration runs of 13</text><text x="28" y="907" font-size="10" fill="#6b6660" opacity="0.72" class="mute">and 14 Sep</text></svg>