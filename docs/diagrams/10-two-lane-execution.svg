<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 781" width="100%" role="img" aria-label="Two-lane execution. Exploration rides beside the typed payload, never inside a fidelity field."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}text.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Mono','Segoe UI Mono','DejaVu Sans Mono','Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@media (prefers-color-scheme:dark){.teal-f{fill:#122925;stroke:#61c2b2}.teal-o{stroke:#61c2b2}.teal-t{fill:#bee8e0}.teal-m{fill:#61c2b2}.teal-h{stroke:#32a091}.purple-f{fill:#242232;stroke:#ada4e6}.purple-o{stroke:#ada4e6}.purple-t{fill:#dddafb}.purple-m{fill:#ada4e6}.purple-h{stroke:#8b81c5}.coral-f{fill:#311f19;stroke:#e39982}.coral-o{stroke:#e39982}.coral-t{fill:#fad5c9}.coral-m{fill:#e39982}.coral-h{stroke:#c0765f}.gray-f{fill:#262421;stroke:#b1ada8}.gray-o{stroke:#b1ada8}.gray-t{fill:#e1ddd8}.gray-m{fill:#b1ada8}.gray-h{stroke:#8f8b87}.surface{fill:#0d0b08}.ink{fill:#ebe7e2}.mute{fill:#dbd7d2}.rule{stroke:#5b5753}}[data-theme=dark] .teal-f{fill:#122925;stroke:#61c2b2}[data-theme=dark] .teal-o{stroke:#61c2b2}[data-theme=dark] .teal-t{fill:#bee8e0}[data-theme=dark] .teal-m{fill:#61c2b2}[data-theme=dark] .teal-h{stroke:#32a091}[data-theme=dark] .purple-f{fill:#242232;stroke:#ada4e6}[data-theme=dark] .purple-o{stroke:#ada4e6}[data-theme=dark] .purple-t{fill:#dddafb}[data-theme=dark] .purple-m{fill:#ada4e6}[data-theme=dark] .purple-h{stroke:#8b81c5}[data-theme=dark] .coral-f{fill:#311f19;stroke:#e39982}[data-theme=dark] .coral-o{stroke:#e39982}[data-theme=dark] .coral-t{fill:#fad5c9}[data-theme=dark] .coral-m{fill:#e39982}[data-theme=dark] .coral-h{stroke:#c0765f}[data-theme=dark] .gray-f{fill:#262421;stroke:#b1ada8}[data-theme=dark] .gray-o{stroke:#b1ada8}[data-theme=dark] .gray-t{fill:#e1ddd8}[data-theme=dark] .gray-m{fill:#b1ada8}[data-theme=dark] .gray-h{stroke:#8f8b87}[data-theme=dark] .surface{fill:#0d0b08}[data-theme=dark] .ink{fill:#ebe7e2}[data-theme=dark] .mute{fill:#dbd7d2}[data-theme=dark] .rule{stroke:#5b5753}[data-theme=light] .teal-f{fill:#dff4ef;stroke:#228c7e}[data-theme=light] .teal-o{stroke:#228c7e}[data-theme=light] .teal-t{fill:#0f5950}[data-theme=light] .teal-m{fill:#228c7e}[data-theme=light] .teal-h{stroke:#32a091}[data-theme=light] .purple-f{fill:#eeecfd;stroke:#7a70af}[data-theme=light] .purple-o{stroke:#7a70af}[data-theme=light] .purple-t{fill:#4d4671}[data-theme=light] .purple-m{fill:#7a70af}[data-theme=light] .purple-h{stroke:#8b81c5}[data-theme=light] .coral-f{fill:#fdeae4;stroke:#aa6550}[data-theme=light] .coral-o{stroke:#aa6550}[data-theme=light] .coral-t{fill:#6e3f30}[data-theme=light] .coral-m{fill:#aa6550}[data-theme=light] .coral-h{stroke:#c0765f}[data-theme=light] .gray-f{fill:#f2eee9;stroke:#7d7a75}[data-theme=light] .gray-o{stroke:#7d7a75}[data-theme=light] .gray-t{fill:#504c48}[data-theme=light] .gray-m{fill:#7d7a75}[data-theme=light] .gray-h{stroke:#8f8b87}[data-theme=light] .surface{fill:#ffffff}[data-theme=light] .ink{fill:#1d1a17}[data-theme=light] .mute{fill:#66635e}[data-theme=light] .rule{stroke:#c1bdb8}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#228c7e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7a70af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#aa6550" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7d7a75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><rect x="0" y="0" width="680" height="781" fill="#ffffff" class="surface"/><text x="28" y="24" font-size="12" fill="#66635e" letter-spacing="1.1" class="mute mono">DIAGRAM 10</text><text x="28" y="52" font-size="21" fill="#1d1a17" font-weight="600" class="ink">Two-lane execution</text><text x="28" y="73" font-size="14" fill="#66635e" class="mute">Exploration rides beside the typed payload, never inside a fidelity field.</text><text x="28" y="96" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">ONE CAPABILITY, TWO LANES</text><text x="28" y="116" font-size="14" fill="#0f5950" class="teal-t">Lane A · factory</text><text x="320" y="116" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">default off</text><text x="360" y="116" font-size="14" fill="#0f5950" class="teal-t">Lane B · product</text><text x="652" y="116" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">primary</text><rect x="28" y="130" width="292" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" stroke-dasharray="5 4" class="teal-f"/><text x="174.0" y="155.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Agent 03c, synthesis</text><text x="174.0" y="172.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">One candidate, when the flag is on</text><rect x="28" y="220" width="292" height="56" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="174.0" y="245.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">Gate A handoff</text><text x="174.0" y="262.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">It rides an opaque rider</text><rect x="28" y="346" width="292" height="56" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="174.0" y="371.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">A person judges it</text><text x="174.0" y="388.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">record-divergence-verdict.ts</text><rect x="360" y="130" width="292" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="506.0" y="155.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">K4 playbook</text><text x="506.0" y="172.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Authored by agent 03b, on opt-in</text><rect x="360" y="220" width="292" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="506.0" y="245.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">reimagine()</text><text x="506.0" y="262.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Mints a divergence_id per candidate</text><rect x="360" y="346" width="292" height="56" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="506.0" y="371.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">A person judges it</text><text x="506.0" y="388.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">No candidate applies itself</text><line x1="174.0" y1="186" x2="174.0" y2="218" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="174.0" y1="276" x2="174.0" y2="284" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="174.0" y1="330" x2="174.0" y2="344" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="506.0" y1="186" x2="506.0" y2="218" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="506.0" y1="276" x2="506.0" y2="344" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="286" width="292" height="44" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="174.0" y="305.0" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">IMAGINATION_GUARD_MODE</text><text x="174.0" y="322.0" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Flags a rider from any other agent</text><line x1="340" y1="124" x2="340" y2="402" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="174.0" y1="402" x2="174.0" y2="420" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="506.0" y1="402" x2="506.0" y2="420" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="422" width="624" height="46" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="443" font-size="14" fill="#0f5950" class="teal-t">Shared by both lanes</text><text x="46" y="460" font-size="12" fill="#0f5950" class="teal-t">One candidate contract, and one verdict bridge: recordDivergenceVerdict</text><rect x="28" y="486" width="624" height="76" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="46" y="510" font-size="14" fill="#504c48" class="gray-t">The only metric is how many candidates survive a person</text><text x="46" y="530" font-size="12" fill="#504c48" class="gray-t">Divergence-survival rate, never quality lift. Never run live: the flag is off,</text><text x="46" y="546" font-size="12" fill="#504c48" class="gray-t">and no other agent is wired until 10 candidates are judged. Last read: 0.</text><line x1="28" y1="588" x2="652" y2="588" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="608" font-size="12" fill="#66635e" class="mute">Every other plate argues that the system refuses things. This one shows where it</text><text x="28" y="626" font-size="12" fill="#66635e" class="mute">is allowed to explore, and how that is fenced: a candidate travels as an opaque</text><text x="28" y="644" font-size="12" fill="#66635e" class="mute">rider that no typed field reads, the orchestrator strips riders when the flag is</text><text x="28" y="662" font-size="12" fill="#66635e" class="mute">off, a check over the written handoffs flags a rider from the wrong agent, and a</text><text x="28" y="680" font-size="12" fill="#66635e" class="mute">person judges each one. The two lanes share one candidate contract and one verdict</text><text x="28" y="698" font-size="12" fill="#66635e" class="mute">path. The code is shipped; the factory lane has never been switched on.</text><text x="28" y="726" font-size="12" fill="#66635e" class="mute">Evidence: shipped - divergence-candidate.ts and the envelope rider,</text><text x="28" y="744" font-size="12" fill="#66635e" class="mute">applyImaginationFlag, runtime-imagination (reimagine), validate-handoff.ts guard,</text><text x="28" y="762" font-size="12" fill="#66635e" class="mute">record-divergence-verdict.ts; audited - never run live, 0 of 10 verdicts</text></svg>