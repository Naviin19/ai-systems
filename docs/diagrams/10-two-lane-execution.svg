<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 714" width="100%" role="img" aria-label="Two-lane execution. Exploration rides beside the typed payload, never inside a fidelity field."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}@media (prefers-color-scheme:dark){.teal-f{fill:#16302c;stroke:#4fb3a3}.teal-o{stroke:#4fb3a3}.teal-t{fill:#82d6c6}.purple-f{fill:#221f38;stroke:#8b7dd0}.purple-o{stroke:#8b7dd0}.purple-t{fill:#ada0e4}.coral-f{fill:#35211b;stroke:#e08a6c}.coral-o{stroke:#e08a6c}.coral-t{fill:#f2ab8e}.gray-f{fill:#232220;stroke:#57534e}.gray-o{stroke:#57534e}.gray-t{fill:#a8a29b}.ink{fill:#ededea}.mute{fill:#a8a29b}.rule{stroke:#3a3835}}[data-theme=dark] .teal-f{fill:#16302c;stroke:#4fb3a3}[data-theme=dark] .teal-o{stroke:#4fb3a3}[data-theme=dark] .teal-t{fill:#82d6c6}[data-theme=dark] .purple-f{fill:#221f38;stroke:#8b7dd0}[data-theme=dark] .purple-o{stroke:#8b7dd0}[data-theme=dark] .purple-t{fill:#ada0e4}[data-theme=dark] .coral-f{fill:#35211b;stroke:#e08a6c}[data-theme=dark] .coral-o{stroke:#e08a6c}[data-theme=dark] .coral-t{fill:#f2ab8e}[data-theme=dark] .gray-f{fill:#232220;stroke:#57534e}[data-theme=dark] .gray-o{stroke:#57534e}[data-theme=dark] .gray-t{fill:#a8a29b}[data-theme=dark] .ink{fill:#ededea}[data-theme=dark] .mute{fill:#a8a29b}[data-theme=dark] .rule{stroke:#3a3835}[data-theme=light] .teal-f{fill:#e8f5f0;stroke:#2d9184}[data-theme=light] .teal-o{stroke:#2d9184}[data-theme=light] .teal-t{fill:#1f6f65}[data-theme=light] .purple-f{fill:#eeeafa;stroke:#6b5bb5}[data-theme=light] .purple-o{stroke:#6b5bb5}[data-theme=light] .purple-t{fill:#4a3f8a}[data-theme=light] .coral-f{fill:#fdeeea;stroke:#d4674a}[data-theme=light] .coral-o{stroke:#d4674a}[data-theme=light] .coral-t{fill:#a84a30}[data-theme=light] .gray-f{fill:#f4f3f1;stroke:#b0aca6}[data-theme=light] .gray-o{stroke:#b0aca6}[data-theme=light] .gray-t{fill:#6b6660}[data-theme=light] .ink{fill:#1a1a1a}[data-theme=light] .mute{fill:#6b6660}[data-theme=light] .rule{stroke:#ddd9d4}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#2d9184" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#6b5bb5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#d4674a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#b0aca6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><text x="28" y="22" font-size="9.5" fill="#6b6660" letter-spacing="1.1" class="mute">DIAGRAM 10</text><text x="28" y="44" font-size="18" fill="#1a1a1a" font-weight="500" class="ink">Two-lane execution</text><text x="28" y="61" font-size="12" fill="#6b6660" class="mute">Exploration rides beside the typed payload, never inside a fidelity field.</text><text x="28" y="96" font-size="12" fill="#6b6660" class="mute">One capability, two lanes</text><text x="28" y="116" font-size="14" fill="#1f6f65" class="teal-t">Lane A · factory</text><text x="320" y="116" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.7" class="teal-t">default off</text><text x="360" y="116" font-size="14" fill="#1f6f65" class="teal-t">Lane B · product</text><text x="652" y="116" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.7" class="teal-t">primary</text><rect x="28" y="130" width="292" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" stroke-dasharray="4 3" class="teal-f"/><text x="174.0" y="155.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Agent 03c, synthesis</text><text x="174.0" y="172.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">One candidate, when the flag is on</text><rect x="28" y="220" width="292" height="56" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="174.0" y="245.0" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">Gate A handoff</text><text x="174.0" y="262.0" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.72" class="gray-t">It rides an opaque rider</text><rect x="28" y="346" width="292" height="56" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="174.0" y="371.0" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">A person judges it</text><text x="174.0" y="388.0" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.72" class="gray-t">record-divergence-verdict.ts</text><rect x="360" y="130" width="292" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="506.0" y="155.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">K4 playbook</text><text x="506.0" y="172.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Authored by agent 03b, on opt-in</text><rect x="360" y="220" width="292" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="506.0" y="245.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">reimagine()</text><text x="506.0" y="262.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Mints a divergence_id per candidate</text><rect x="360" y="346" width="292" height="56" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="506.0" y="371.0" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">A person judges it</text><text x="506.0" y="388.0" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.72" class="gray-t">No candidate applies itself</text><line x1="174.0" y1="186" x2="174.0" y2="218" stroke="#b0aca6" stroke-width="1.5" opacity="0.65" marker-end="url(#ar-gray)" class="gray-o"/><line x1="174.0" y1="276" x2="174.0" y2="284" stroke="#b0aca6" stroke-width="1.5" opacity="0.65" marker-end="url(#ar-gray)" class="gray-o"/><line x1="174.0" y1="330" x2="174.0" y2="344" stroke="#b0aca6" stroke-width="1.5" opacity="0.65" marker-end="url(#ar-gray)" class="gray-o"/><line x1="506.0" y1="186" x2="506.0" y2="218" stroke="#b0aca6" stroke-width="1.5" opacity="0.65" marker-end="url(#ar-gray)" class="gray-o"/><line x1="506.0" y1="276" x2="506.0" y2="344" stroke="#b0aca6" stroke-width="1.5" opacity="0.65" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="286" width="292" height="44" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="174.0" y="305.0" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">IMAGINATION_GUARD_MODE</text><text x="174.0" y="322.0" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.72" class="coral-t">Flags a rider from any other agent</text><line x1="340" y1="124" x2="340" y2="402" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 3" class="gray-o"/><line x1="174.0" y1="402" x2="174.0" y2="420" stroke="#b0aca6" stroke-width="1.5" opacity="0.65" marker-end="url(#ar-gray)" class="gray-o"/><line x1="506.0" y1="402" x2="506.0" y2="420" stroke="#b0aca6" stroke-width="1.5" opacity="0.65" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="422" width="624" height="46" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="443" font-size="14" fill="#1f6f65" class="teal-t">Shared by both lanes</text><text x="46" y="460" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">One candidate contract, and one verdict bridge: recordDivergenceVerdict</text><rect x="28" y="486" width="624" height="76" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="46" y="510" font-size="14" fill="#6b6660" class="gray-t">The only metric is how many candidates survive a person</text><text x="46" y="530" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Divergence-survival rate, never quality lift. Never run live: the flag is off,</text><text x="46" y="546" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">and no other agent is wired until 10 candidates are judged. Last read: 0.</text><line x1="28" y1="588" x2="652" y2="588" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="605" font-size="10" fill="#6b6660" class="mute">Every other plate argues that the system refuses things. This one shows where it is allowed to explore,</text><text x="28" y="618" font-size="10" fill="#6b6660" class="mute">and how that is fenced: a candidate travels as an opaque rider that no typed field reads, the</text><text x="28" y="631" font-size="10" fill="#6b6660" class="mute">orchestrator strips riders when the flag is off, a check over the written handoffs flags a rider from</text><text x="28" y="644" font-size="10" fill="#6b6660" class="mute">the wrong agent, and a person judges each one. The two lanes share one candidate contract and one</text><text x="28" y="657" font-size="10" fill="#6b6660" class="mute">verdict path. The code is shipped; the factory lane has never been switched on.</text><text x="28" y="674" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - divergence-candidate.ts and the envelope rider, applyImaginationFlag,</text><text x="28" y="687" font-size="10" fill="#6b6660" opacity="0.72" class="mute">runtime-imagination (reimagine), validate-handoff.ts guard, record-divergence-verdict.ts; audited -</text><text x="28" y="700" font-size="10" fill="#6b6660" opacity="0.72" class="mute">never run live, 0 of 10 verdicts</text></svg>