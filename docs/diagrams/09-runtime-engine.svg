dark] .ink{fill:#ebe7e2}[data-theme=dark] .mute{fill:#dbd7d2}[data-theme=dark] .rule{stroke:#5b5753}[data-theme=light] .teal-f{fill:#dff4ef;stroke:#228c7e}[data-theme=light] .teal-o{stroke:#228c7e}[data-theme=light] .teal-t{fill:#0f5950}[data-theme=light] .teal-m{fill:#228c7e}[data-theme=light] .teal-h{stroke:#32a091}[data-theme=light] .purple-f{fill:#eeecfd;stroke:#7a70af}[data-theme=light] .purple-o{stroke:#7a70af}[data-theme=light] .purple-t{fill:#4d4671}[data-theme=light] .purple-m{fill:#7a70af}[data-theme=light] .purple-h{stroke:#8b81c5}[data-theme=light] .coral-f{fill:#fdeae4;stroke:#aa6550}[data-theme=light] .coral-o{stroke:#aa6550}[data-theme=light] .coral-t{fill:#6e3f30}[data-theme=light] .coral-m{fill:#aa6550}[data-theme=light] .coral-h{stroke:#c0765f}[data-theme=light] .gray-f{fill:#f2eee9;stroke:#7d7a75}[data-theme=light] .gray-o{stroke:#7d7a75}[data-theme=light] .gray-t{fill:#504c48}[data-theme=light] .gray-m{fill:#7d7a75}[data-theme=light] .gray-h{stroke:#8f8b87}[data-theme=light] .surface{fill:#ffffff}[data-theme=light] .ink{fill:#1d1a17}[data-theme=light] .mute{fill:#66635e}[data-theme=light] .rule{stroke:#c1bdb8}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#228c7e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7a70af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#aa6550" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7d7a75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><rect x="0" y="0" width="680" height="731" fill="#ffffff" class="surface"/><text x="28" y="24" font-size="12" fill="#66635e" letter-spacing="1.1" class="mute mono">DIAGRAM 09</text><text x="28" y="52" font-size="21" fill="#1d1a17" font-weight="600" class="ink">The runtime engine</text><text x="28" y="73" font-size="14" fill="#66635e" class="mute">The packages a product runs on, and the product that runs on them.</text><text x="28" y="96" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">REQUEST PATH, AS THE PACKAGES IMPLEMENT IT</text><rect x="28" y="106" width="292" height="48" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="174.0" y="127.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">Caller</text><text x="174.0" y="144.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">Names a tier and a call site</text><rect x="360" y="106" width="292" height="48" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="506.0" y="127.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Model router</text><text x="506.0" y="144.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Resolves a model for the tier</text><line x1="320" y1="130" x2="358" y2="130" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="506" y1="154" x2="506" y2="166" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="103" y1="166" x2="577" y2="166" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="103" y1="166" x2="103" y2="174" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="176" width="150" height="46" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="103.0" y="204.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">FORENSIC</text><line x1="103" y1="222" x2="103" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="261" y1="166" x2="261" y2="174" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="186" y="176" width="150" height="46" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="261.0" y="204.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">SYNTHESIS</text><line x1="261" y1="222" x2="261" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="419" y1="166" x2="419" y2="174" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="344" y="176" width="150" height="46" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="419.0" y="204.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">NARRATIVE</text><line x1="419" y1="222" x2="419" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="577" y1="166" x2="577" y2="174" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="502" y="176" width="150" height="46" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="577.0" y="204.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">VISION</text><line x1="577" y1="222" x2="577" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="103" y1="236" x2="577" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="178" y1="236" x2="178" y2="252" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="254" width="300" height="84" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="278" font-size="14" fill="#0f5950" class="teal-t">LLM gateway</text><text x="46" y="298" font-size="12" fill="#0f5950" class="teal-t">Provider-agnostic dispatch</text><text x="46" y="314" font-size="12" fill="#0f5950" class="teal-t">Latency recorded per call</text><text x="46" y="330" font-size="12" fill="#0f5950" class="teal-t">Cost cap priced at zero tokens</text><rect x="352" y="254" width="300" height="84" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="370" y="278" font-size="14" fill="#0f5950" class="teal-t">MCP host</text><text x="634" y="278" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">3 default servers</text><text x="370" y="298" font-size="12" fill="#0f5950" class="teal-t">Apify · Apollo · Human Steering</text><text x="370" y="314" font-size="12" fill="#0f5950" class="teal-t">Replayed in CI from recordings</text><text x="370" y="330" font-size="12" fill="#0f5950" class="teal-t">Off in builds unless enabled</text><rect x="28" y="362" width="624" height="50" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="46" y="384" font-size="14" fill="#504c48" class="gray-t">Cost and latency are measured, not enforced</text><text x="46" y="402" font-size="12" fill="#504c48" class="gray-t">No cost cap can fire, and the factory's build-end deltas only flag</text><text x="28" y="440" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">THE PRODUCT ON THE GATEWAY</text><rect x="28" y="452" width="624" height="50" rx="5" fill="#eeecfd" stroke="#7a70af" stroke-width="1.0" class="purple-f"/><text x="46" y="474" font-size="14" fill="#4d4671" class="purple-t">Author</text><text x="634" y="474" font-size="12" fill="#4d4671" text-anchor="end" class="purple-t">Live</text><text x="46" y="492" font-size="12" fill="#4d4671" class="purple-t">Its app calls gatewayCall on its own copy of llm-gateway, per stage</text><text x="28" y="526" font-size="12" fill="#66635e" class="mute">Whitespace Hunter uses none of these packages: DataForSEO and a weekly cron.</text><line x1="28" y1="556" x2="652" y2="556" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="576" font-size="12" fill="#66635e" class="mute">The caller names a tier and a call site; the router resolves a model and the</text><text x="28" y="594" font-size="12" fill="#66635e" class="mute">gateway dispatches it, recording each call's latency. Cost does not stop a run:</text><text x="28" y="612" font-size="12" fill="#66635e" class="mute">the gateway's cap prices a call at zero tokens, and the factory's build-end token</text><text x="28" y="630" font-size="12" fill="#66635e" class="mute">and wall-time comparison only flags. Author's app is the production caller, on its</text><text x="28" y="648" font-size="12" fill="#66635e" class="mute">own copy of the gateway. Whitespace Hunter, the product with a public URL, uses</text><text x="28" y="666" font-size="12" fill="#66635e" class="mute">none of this.</text><text x="28" y="694" font-size="12" fill="#66635e" class="mute">Evidence: shipped - llm-gateway, model-router and mcp-infra packages; audited -</text><text x="28" y="712" font-size="12" fill="#66635e" class="mute">Author's gateway-client.ts at 833dec6, Whitespace Hunter at 1c0529c</text></svg>