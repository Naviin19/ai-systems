<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 676" width="100%" role="img" aria-label="The runtime engine. Production operation with cost governance, not just a build pipeline."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}@media (prefers-color-scheme:dark){.teal-f{fill:#16302c;stroke:#4fb3a3}.teal-o{stroke:#4fb3a3}.teal-t{fill:#82d6c6}.purple-f{fill:#221f38;stroke:#8b7dd0}.purple-o{stroke:#8b7dd0}.purple-t{fill:#ada0e4}.coral-f{fill:#35211b;stroke:#e08a6c}.coral-o{stroke:#e08a6c}.coral-t{fill:#f2ab8e}.gray-f{fill:#232220;stroke:#57534e}.gray-o{stroke:#57534e}.gray-t{fill:#a8a29b}.ink{fill:#ededea}.mute{fill:#a8a29b}.rule{stroke:#3a3835}}[data-theme=dark] .teal-f{fill:#16302c;stroke:#4fb3a3}[data-theme=dark] .teal-o{stroke:#4fb3a3}[data-theme=dark] .teal-t{fill:#82d6c6}[data-theme=dark] .purple-f{fill:#221f38;stroke:#8b7dd0}[data-theme=dark] .purple-o{stroke:#8b7dd0}[data-theme=dark] .purple-t{fill:#ada0e4}[data-theme=dark] .coral-f{fill:#35211b;stroke:#e08a6c}[data-theme=dark] .coral-o{stroke:#e08a6c}[data-theme=dark] .coral-t{fill:#f2ab8e}[data-theme=dark] .gray-f{fill:#232220;stroke:#57534e}[data-theme=dark] .gray-o{stroke:#57534e}[data-theme=dark] .gray-t{fill:#a8a29b}[data-theme=dark] .ink{fill:#ededea}[data-theme=dark] .mute{fill:#a8a29b}[data-theme=dark] .rule{stroke:#3a3835}[data-theme=light] .teal-f{fill:#e8f5f0;stroke:#2d9184}[data-theme=light] .teal-o{stroke:#2d9184}[data-theme=light] .teal-t{fill:#1f6f65}[data-theme=light] .purple-f{fill:#eeeafa;stroke:#6b5bb5}[data-theme=light] .purple-o{stroke:#6b5bb5}[data-theme=light] .purple-t{fill:#4a3f8a}[data-theme=light] .coral-f{fill:#fdeeea;stroke:#d4674a}[data-theme=light] .coral-o{stroke:#d4674a}[data-theme=light] .coral-t{fill:#a84a30}[data-theme=light] .gray-f{fill:#f4f3f1;stroke:#b0aca6}[data-theme=light] .gray-o{stroke:#b0aca6}[data-theme=light] .gray-t{fill:#6b6660}[data-theme=light] .ink{fill:#1a1a1a}[data-theme=light] .mute{fill:#6b6660}[data-theme=light] .rule{stroke:#ddd9d4}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#2d9184" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#6b5bb5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#d4674a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#b0aca6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><text x="28" y="22" font-size="9.5" fill="#6b6660" letter-spacing="1.1" class="mute">DIAGRAM 09</text><text x="28" y="44" font-size="18" fill="#1a1a1a" font-weight="500" class="ink">The runtime engine</text><text x="28" y="61" font-size="12" fill="#6b6660" class="mute">Production operation with cost governance, not just a build pipeline.</text><text x="28" y="96" font-size="12" fill="#6b6660" class="mute">Request path</text><rect x="28" y="106" width="180" height="48" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="118.0" y="127.0" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">Session context</text><text x="118.0" y="144.0" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.72" class="gray-t">Personalization state</text><rect x="236" y="106" width="180" height="48" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="326.0" y="127.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Load estimator</text><text x="326.0" y="144.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Tokens and latency</text><rect x="444" y="106" width="208" height="48" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="548.0" y="127.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Model router</text><text x="548.0" y="144.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Tier by task complexity</text><line x1="208" y1="130" x2="234" y2="130" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="416" y1="130" x2="442" y2="130" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="548" y1="154" x2="548" y2="166" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" class="gray-o"/><line x1="103" y1="166" x2="577" y2="166" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" class="gray-o"/><line x1="103" y1="166" x2="103" y2="174" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="176" width="150" height="46" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="103.0" y="204.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Forensic</text><line x1="103" y1="222" x2="103" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" class="gray-o"/><line x1="261" y1="166" x2="261" y2="174" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="186" y="176" width="150" height="46" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="261.0" y="204.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Precision</text><line x1="261" y1="222" x2="261" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" class="gray-o"/><line x1="419" y1="166" x2="419" y2="174" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="344" y="176" width="150" height="46" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="419.0" y="204.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Synthesis</text><line x1="419" y1="222" x2="419" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" class="gray-o"/><line x1="577" y1="166" x2="577" y2="174" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="502" y="176" width="150" height="46" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="577.0" y="204.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Narrative</text><line x1="577" y1="222" x2="577" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" class="gray-o"/><line x1="103" y1="236" x2="577" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" class="gray-o"/><line x1="178" y1="236" x2="178" y2="252" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><line x1="502" y1="236" x2="502" y2="252" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="254" width="300" height="84" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="278" font-size="14" fill="#1f6f65" class="teal-t">LLM gateway</text><text x="46" y="298" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Provider-agnostic dispatch</text><text x="46" y="314" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Latency profiled per call</text><rect x="352" y="254" width="300" height="84" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="370" y="278" font-size="14" fill="#1f6f65" class="teal-t">MCP host</text><text x="634" y="278" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">6 connectors</text><text x="370" y="298" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Human Steering · Apify · Apollo</text><text x="370" y="314" font-size="12" fill="#1f6f65" opacity="0.72" class="teal-t">Google News · SerpAPI · YouTube</text><text x="370" y="330" font-size="12" fill="#1f6f65" opacity="0.55" class="teal-t">Replayed in CI from fixtures</text><line x1="178" y1="338" x2="178" y2="360" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><line x1="502" y1="338" x2="502" y2="360" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="362" width="624" height="50" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="46" y="385" font-size="14" fill="#a84a30" class="coral-t">Circuit breakers</text><text x="46" y="403" font-size="12" fill="#a84a30" opacity="0.74" class="coral-t">The build fails if cost drifts past 30% or wall-time past 20% of the configured SLA</text><line x1="340" y1="412" x2="340" y2="436" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="438" width="624" height="50" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="46" y="460" font-size="14" fill="#6b6660" class="gray-t">Telemetry out</text><text x="46" y="479" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Gate outcomes, given-against-done receipts and residual margins return to the loops, plate 08</text><text x="28" y="516" font-size="12" fill="#6b6660" class="mute">What this engine is currently serving</text><rect x="28" y="528" width="624" height="48" rx="5" fill="#eeeafa" stroke="#6b5bb5" stroke-width="0.5" class="purple-f"/><text x="46" y="552" font-size="14" fill="#4a3f8a" class="purple-t">whitespace-hunter.vercel.app</text><text x="634" y="552" font-size="12" fill="#4a3f8a" text-anchor="end" opacity="0.74" class="purple-t">Deployed 2 Sep · DataForSEO · weekly digest via Resend</text><line x1="28" y1="602" x2="652" y2="602" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="619" font-size="10" fill="#6b6660" class="mute">Routing is a decision the system makes per task, and cost is a condition that can stop a run, so both</text><text x="28" y="632" font-size="10" fill="#6b6660" class="mute">belong in the same grammar as the build-time gates. The last row is the only claim in this set a reader</text><text x="28" y="645" font-size="10" fill="#6b6660" class="mute">can settle without trusting the set: the URL either loads or it does not.</text><text x="28" y="662" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - model-router, llm-gateway, mcp-infra, whitespace-hunter</text></svg>