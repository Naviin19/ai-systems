<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 797" width="100%" role="img" aria-label="The learning loops. Two loops, and in both a person decides what becomes permanent."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}@media (prefers-color-scheme:dark){.teal-f{fill:#16302c;stroke:#4fb3a3}.teal-o{stroke:#4fb3a3}.teal-t{fill:#82d6c6}.purple-f{fill:#221f38;stroke:#8b7dd0}.purple-o{stroke:#8b7dd0}.purple-t{fill:#ada0e4}.coral-f{fill:#35211b;stroke:#e08a6c}.coral-o{stroke:#e08a6c}.coral-t{fill:#f2ab8e}.gray-f{fill:#232220;stroke:#57534e}.gray-o{stroke:#57534e}.gray-t{fill:#a8a29b}.ink{fill:#ededea}.mute{fill:#a8a29b}.rule{stroke:#3a3835}}[data-theme=dark] .teal-f{fill:#16302c;stroke:#4fb3a3}[data-theme=dark] .teal-o{stroke:#4fb3a3}[data-theme=dark] .teal-t{fill:#82d6c6}[data-theme=dark] .purple-f{fill:#221f38;stroke:#8b7dd0}[data-theme=dark] .purple-o{stroke:#8b7dd0}[data-theme=dark] .purple-t{fill:#ada0e4}[data-theme=dark] .coral-f{fill:#35211b;stroke:#e08a6c}[data-theme=dark] .coral-o{stroke:#e08a6c}[data-theme=dark] .coral-t{fill:#f2ab8e}[data-theme=dark] .gray-f{fill:#232220;stroke:#57534e}[data-theme=dark] .gray-o{stroke:#57534e}[data-theme=dark] .gray-t{fill:#a8a29b}[data-theme=dark] .ink{fill:#ededea}[data-theme=dark] .mute{fill:#a8a29b}[data-theme=dark] .rule{stroke:#3a3835}[data-theme=light] .teal-f{fill:#e8f5f0;stroke:#2d9184}[data-theme=light] .teal-o{stroke:#2d9184}[data-theme=light] .teal-t{fill:#1f6f65}[data-theme=light] .purple-f{fill:#eeeafa;stroke:#6b5bb5}[data-theme=light] .purple-o{stroke:#6b5bb5}[data-theme=light] .purple-t{fill:#4a3f8a}[data-theme=light] .coral-f{fill:#fdeeea;stroke:#d4674a}[data-theme=light] .coral-o{stroke:#d4674a}[data-theme=light] .coral-t{fill:#a84a30}[data-theme=light] .gray-f{fill:#f4f3f1;stroke:#b0aca6}[data-theme=light] .gray-o{stroke:#b0aca6}[data-theme=light] .gray-t{fill:#6b6660}[data-theme=light] .ink{fill:#1a1a1a}[data-theme=light] .mute{fill:#6b6660}[data-theme=light] .rule{stroke:#ddd9d4}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#2d9184" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#6b5bb5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#d4674a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#b0aca6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><text x="28" y="22" font-size="9.5" fill="#6b6660" letter-spacing="1.1" class="mute">DIAGRAM 08</text><text x="28" y="44" font-size="18" fill="#1a1a1a" font-weight="500" class="ink">The learning loops</text><text x="28" y="61" font-size="12" fill="#6b6660" class="mute">Two loops, and in both a person decides what becomes permanent.</text><text x="28" y="96" font-size="12" fill="#6b6660" class="mute">Recorded, and not yet read by either loop</text><rect x="28" y="106" width="624" height="46" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="46" y="128" font-size="14" fill="#6b6660" class="gray-t">verification/feedback/feedback.jsonl</text><text x="46" y="145" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Gate outcomes · receipt counts · tokens and wall time · craftsmanship margins</text><text x="28" y="178" font-size="12" fill="#6b6660" class="mute">Amendment lane, a protocol</text><rect x="30" y="210" width="102" height="52" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="81.0" y="233.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Capture</text><text x="81.0" y="250.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">learning event</text><rect x="146" y="210" width="102" height="52" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="197.0" y="233.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Structure</text><text x="197.0" y="250.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">dedupe · rank</text><rect x="262" y="210" width="102" height="52" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="313.0" y="233.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Propose</text><text x="313.0" y="250.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">a proposal</text><rect x="416" y="210" width="102" height="52" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="467.0" y="233.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Apply</text><text x="467.0" y="250.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">edit + cascade</text><rect x="532" y="210" width="102" height="52" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="583.0" y="233.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Verify</text><text x="583.0" y="250.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">re-scored</text><line x1="132" y1="236" x2="144" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="248" y1="236" x2="260" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="364" y1="236" x2="366" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="412" y1="236" x2="414" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="518" y1="236" x2="530" y2="236" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="368" y="190" width="44" height="92" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="390" y="184" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">Human approval</text><text x="390" y="300" font-size="12" fill="#a84a30" text-anchor="middle" class="coral-t">Loop stops here</text><text x="390" y="316" font-size="12" fill="#6b6660" text-anchor="middle" class="mute">Tiers 1 and 2: not in force</text><path d="M583,262 L583,338 L81,338 L81,266" fill="none" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><text x="28" y="370" font-size="12" fill="#6b6660" class="mute">Convention lane: capture is automatic, promotion is not</text><rect x="28" y="384" width="144" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="100.0" y="409.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">capture-rule.mjs</text><text x="100.0" y="426.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Captures directives</text><rect x="188" y="384" width="144" height="56" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="260.0" y="406" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">Seen in 2 sessions</text><rect x="255.5" y="414" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><rect x="262.1" y="414" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><text x="260.0" y="434" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.7" class="coral-t">gates promotion</text><line x1="172" y1="412" x2="186" y2="412" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="348" y="384" width="144" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="420.0" y="409.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">promote.mjs</text><text x="420.0" y="426.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">A person promotes it</text><line x1="332" y1="412" x2="346" y2="412" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="508" y="384" width="144" height="56" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="580.0" y="409.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">AGENTS.md</text><text x="580.0" y="426.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">The learned block</text><line x1="492" y1="412" x2="506" y2="412" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="260" y1="440" x2="260" y2="462" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="152" y="464" width="216" height="44" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" stroke-dasharray="4 3" class="gray-f"/><text x="260" y="485" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">run/board/</text><text x="260" y="501" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.74" class="gray-t">Seen once; decays when swept</text><line x1="580" y1="440" x2="580" y2="462" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="452" y="464" width="200" height="44" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="552" y="485" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">Retire</text><text x="552" y="501" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">retire-when, on --review</text><text x="28" y="542" font-size="12" fill="#6b6660" class="mute">Settled decisions live in a separate ledger</text><rect x="28" y="554" width="624" height="70" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="46" y="578" font-size="14" fill="#6b6660" class="gray-t">build-log/decision-ledger.jsonl</text><text x="46" y="598" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">Append-only, schema-validated. R23 injects matching rows into agent context,</text><text x="46" y="616" font-size="12" fill="#6b6660" opacity="0.72" class="gray-t">and R24 flags an output that contradicts one, in warn mode.</text><text x="28" y="652" font-size="12" fill="#6b6660" class="mute">Verified change re-enters the corpus, plate 02</text><line x1="28" y1="684" x2="652" y2="684" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="701" font-size="10" fill="#6b6660" class="mute">A rule that recurs across two sessions is listed as a convention and promoted by hand; below that, a</text><text x="28" y="714" font-size="10" fill="#6b6660" class="mute">person has to give a reason. A finding seen once goes to the board when a person routes it there, and</text><text x="28" y="727" font-size="10" fill="#6b6660" class="mute">decays when the board is swept. The amendment lane is a documented protocol whose human approval is the</text><text x="28" y="740" font-size="10" fill="#6b6660" class="mute">only route, because the tiers that would skip it are not in force. The decision ledger is a third store,</text><text x="28" y="753" font-size="10" fill="#6b6660" class="mute">which the pipeline reads back into context.</text><text x="28" y="770" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - capture-rule.mjs, promote.mjs, board.mjs, AGENTS.md, decision-ledger.jsonl (R23,</text><text x="28" y="783" font-size="10" fill="#6b6660" opacity="0.72" class="mute">R24); audited - the amendment lane, a protocol in learning-loop.md with no implementing code</text></svg>