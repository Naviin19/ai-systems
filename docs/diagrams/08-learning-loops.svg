k] .ink{fill:#ebe7e2}[data-theme=dark] .mute{fill:#dbd7d2}[data-theme=dark] .rule{stroke:#5b5753}[data-theme=light] .teal-f{fill:#dff4ef;stroke:#228c7e}[data-theme=light] .teal-o{stroke:#228c7e}[data-theme=light] .teal-t{fill:#0f5950}[data-theme=light] .teal-m{fill:#228c7e}[data-theme=light] .teal-h{stroke:#32a091}[data-theme=light] .purple-f{fill:#eeecfd;stroke:#7a70af}[data-theme=light] .purple-o{stroke:#7a70af}[data-theme=light] .purple-t{fill:#4d4671}[data-theme=light] .purple-m{fill:#7a70af}[data-theme=light] .purple-h{stroke:#8b81c5}[data-theme=light] .coral-f{fill:#fdeae4;stroke:#aa6550}[data-theme=light] .coral-o{stroke:#aa6550}[data-theme=light] .coral-t{fill:#6e3f30}[data-theme=light] .coral-m{fill:#aa6550}[data-theme=light] .coral-h{stroke:#c0765f}[data-theme=light] .gray-f{fill:#f2eee9;stroke:#7d7a75}[data-theme=light] .gray-o{stroke:#7d7a75}[data-theme=light] .gray-t{fill:#504c48}[data-theme=light] .gray-m{fill:#7d7a75}[data-theme=light] .gray-h{stroke:#8f8b87}[data-theme=light] .surface{fill:#ffffff}[data-theme=light] .ink{fill:#1d1a17}[data-theme=light] .mute{fill:#66635e}[data-theme=light] .rule{stroke:#c1bdb8}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#228c7e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7a70af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#aa6550" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7d7a75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><rect x="0" y="0" width="680" height="877" fill="#ffffff" class="surface"/><text x="28" y="24" font-size="12" fill="#66635e" letter-spacing="1.1" class="mute mono">DIAGRAM 08</text><text x="28" y="52" font-size="21" fill="#1d1a17" font-weight="600" class="ink">The learning loops</text><text x="28" y="73" font-size="14" fill="#66635e" class="mute">Two loops, and in both a person decides what becomes permanent.</text><text x="28" y="96" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">RECORDED, AND NOT YET READ BY EITHER LOOP</text><rect x="28" y="106" width="624" height="46" rx="5" fill="none" stroke="#7d7a75" stroke-width="1.0" class="gray-o"/><text x="46" y="128" font-size="14" fill="#504c48" class="gray-t">verification/feedback/feedback.jsonl</text><text x="46" y="145" font-size="12" fill="#504c48" class="gray-t">Gate outcomes · receipt counts · tokens and wall time · craftsmanship margins</text><text x="28" y="178" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">AMENDMENT LANE, A PROTOCOL</text><rect x="30" y="210" width="102" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="81.0" y="233.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Capture</text><text x="81.0" y="250.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">learning event</text><rect x="146" y="210" width="102" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="197.0" y="233.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Structure</text><text x="197.0" y="250.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">dedupe · rank</text><rect x="262" y="210" width="102" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="313.0" y="233.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Propose</text><text x="313.0" y="250.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">a proposal</text><rect x="416" y="210" width="102" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="467.0" y="233.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Apply</text><text x="467.0" y="250.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">edit + cascade</text><rect x="532" y="210" width="102" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="583.0" y="233.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Verify</text><text x="583.0" y="250.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">re-scored</text><line x1="132" y1="236" x2="144" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="248" y1="236" x2="260" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="364" y1="236" x2="366" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="412" y1="236" x2="414" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="518" y1="236" x2="530" y2="236" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="368" y="190" width="44" height="92" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="390" y="184" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Human approval</text><text x="390" y="300" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Loop stops here</text><text x="390" y="316" font-size="12" fill="#66635e" text-anchor="middle" class="mute">Tiers 1 and 2: not in force</text><path d="M583,262 L583,338 L81,338 L81,266" fill="none" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><text x="28" y="370" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">CONVENTION LANE: CAPTURE IS AUTOMATIC, PROMOTION IS NOT</text><rect x="28" y="384" width="144" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="100.0" y="409.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">capture-rule.mjs</text><text x="100.0" y="426.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Captures directives</text><rect x="188" y="384" width="144" height="56" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="260.0" y="406" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Seen in 2 sessions</text><rect x="255.5" y="414" width="2.4" height="8" rx="0" fill="#aa6550" class="coral-m"/><rect x="262.1" y="414" width="2.4" height="8" rx="0" fill="#aa6550" class="coral-m"/><text x="260.0" y="434" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">gates promotion</text><line x1="172" y1="412" x2="186" y2="412" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="348" y="384" width="144" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="420.0" y="409.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">promote.mjs</text><text x="420.0" y="426.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">A person promotes it</text><line x1="332" y1="412" x2="346" y2="412" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="508" y="384" width="144" height="56" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="580.0" y="409.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">AGENTS.md</text><text x="580.0" y="426.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">The learned block</text><line x1="492" y1="412" x2="506" y2="412" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="260" y1="440" x2="260" y2="462" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="152" y="464" width="216" height="44" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="260" y="485" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">run/board/</text><text x="260" y="501" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">Seen once; decays when swept</text><line x1="368" y1="486" x2="450" y2="486" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="452" y="464" width="200" height="44" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="552" y="485" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Retire</text><text x="552" y="501" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">retire-when, on --review</text><text x="28" y="542" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">SETTLED DECISIONS LIVE IN A SEPARATE LEDGER</text><rect x="28" y="554" width="624" height="70" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="46" y="578" font-size="14" fill="#504c48" class="gray-t">build-log/decision-ledger.jsonl</text><text x="46" y="598" font-size="12" fill="#504c48" class="gray-t">Append-only, schema-validated. R23 injects matching rows into agent context,</text><text x="46" y="616" font-size="12" fill="#504c48" class="gray-t">and R24 flags an output that contradicts one, in warn mode.</text><text x="28" y="652" font-size="12" fill="#66635e" class="mute">Verified change re-enters the corpus, plate 02</text><line x1="28" y1="684" x2="652" y2="684" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="704" font-size="12" fill="#66635e" class="mute">A rule that recurs across two sessions is listed as a convention and promoted by</text><text x="28" y="722" font-size="12" fill="#66635e" class="mute">hand; below that, a person has to give a reason. A finding seen once goes to the</text><text x="28" y="740" font-size="12" fill="#66635e" class="mute">board when a person routes it there, and decays when the board is swept. The</text><text x="28" y="758" font-size="12" fill="#66635e" class="mute">amendment lane is a documented protocol whose human approval is the only route,</text><text x="28" y="776" font-size="12" fill="#66635e" class="mute">because the tiers that would skip it are not in force. The decision ledger is a</text><text x="28" y="794" font-size="12" fill="#66635e" class="mute">third store, which the pipeline reads back into context.</text><text x="28" y="822" font-size="12" fill="#66635e" class="mute">Evidence: shipped - capture-rule.mjs, promote.mjs, board.mjs, AGENTS.md,</text><text x="28" y="840" font-size="12" fill="#66635e" class="mute">decision-ledger.jsonl (R23, R24); audited - the amendment lane, a protocol in</text><text x="28" y="858" font-size="12" fill="#66635e" class="mute">learning-loop.md with no implementing code</text></svg>