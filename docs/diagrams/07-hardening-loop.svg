<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 515" width="100%" role="img" aria-label="The hardening loop. Promotion requires a proof of convergence."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}@media (prefers-color-scheme:dark){.teal-f{fill:#16302c;stroke:#4fb3a3}.teal-o{stroke:#4fb3a3}.teal-t{fill:#82d6c6}.purple-f{fill:#221f38;stroke:#8b7dd0}.purple-o{stroke:#8b7dd0}.purple-t{fill:#ada0e4}.coral-f{fill:#35211b;stroke:#e08a6c}.coral-o{stroke:#e08a6c}.coral-t{fill:#f2ab8e}.gray-f{fill:#232220;stroke:#57534e}.gray-o{stroke:#57534e}.gray-t{fill:#a8a29b}.ink{fill:#ededea}.mute{fill:#a8a29b}.rule{stroke:#3a3835}}[data-theme=dark] .teal-f{fill:#16302c;stroke:#4fb3a3}[data-theme=dark] .teal-o{stroke:#4fb3a3}[data-theme=dark] .teal-t{fill:#82d6c6}[data-theme=dark] .purple-f{fill:#221f38;stroke:#8b7dd0}[data-theme=dark] .purple-o{stroke:#8b7dd0}[data-theme=dark] .purple-t{fill:#ada0e4}[data-theme=dark] .coral-f{fill:#35211b;stroke:#e08a6c}[data-theme=dark] .coral-o{stroke:#e08a6c}[data-theme=dark] .coral-t{fill:#f2ab8e}[data-theme=dark] .gray-f{fill:#232220;stroke:#57534e}[data-theme=dark] .gray-o{stroke:#57534e}[data-theme=dark] .gray-t{fill:#a8a29b}[data-theme=dark] .ink{fill:#ededea}[data-theme=dark] .mute{fill:#a8a29b}[data-theme=dark] .rule{stroke:#3a3835}[data-theme=light] .teal-f{fill:#e8f5f0;stroke:#2d9184}[data-theme=light] .teal-o{stroke:#2d9184}[data-theme=light] .teal-t{fill:#1f6f65}[data-theme=light] .purple-f{fill:#eeeafa;stroke:#6b5bb5}[data-theme=light] .purple-o{stroke:#6b5bb5}[data-theme=light] .purple-t{fill:#4a3f8a}[data-theme=light] .coral-f{fill:#fdeeea;stroke:#d4674a}[data-theme=light] .coral-o{stroke:#d4674a}[data-theme=light] .coral-t{fill:#a84a30}[data-theme=light] .gray-f{fill:#f4f3f1;stroke:#b0aca6}[data-theme=light] .gray-o{stroke:#b0aca6}[data-theme=light] .gray-t{fill:#6b6660}[data-theme=light] .ink{fill:#1a1a1a}[data-theme=light] .mute{fill:#6b6660}[data-theme=light] .rule{stroke:#ddd9d4}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#2d9184" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#6b5bb5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#d4674a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#b0aca6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><text x="28" y="22" font-size="9.5" fill="#6b6660" letter-spacing="1.1" class="mute">DIAGRAM 07</text><text x="28" y="44" font-size="18" fill="#1a1a1a" font-weight="500" class="ink">The hardening loop</text><text x="28" y="61" font-size="12" fill="#6b6660" class="mute">Promotion requires a proof of convergence.</text><text x="28" y="112" font-size="12" fill="#6b6660" class="mute">One hardening round, against staging</text><rect x="28" y="170" width="150" height="60" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="103.0" y="197.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Playwright ×10</text><text x="103.0" y="214.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Against staging</text><rect x="186" y="170" width="150" height="60" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="261.0" y="197.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Dedupe</text><text x="261.0" y="214.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Collapse failures</text><rect x="344" y="170" width="150" height="60" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="419.0" y="197.0" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">Human Q1 · Q2</text><text x="419.0" y="214.0" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.72" class="coral-t">Approves each edit</text><rect x="502" y="170" width="150" height="60" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="577.0" y="197.0" font-size="14" fill="#1f6f65" text-anchor="middle" class="teal-t">Patch, re-run</text><text x="577.0" y="214.0" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.72" class="teal-t">Redeploy, 10× again</text><line x1="178" y1="200" x2="184" y2="200" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="336" y1="200" x2="342" y2="200" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><line x1="494" y1="200" x2="500" y2="200" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><path d="M577,170 L577,146 L103,146 L103,168" fill="none" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><text x="340" y="140" font-size="12" fill="#6b6660" text-anchor="middle" class="mute">Next round</text><line x1="577" y1="230" x2="577" y2="262" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><text x="569" y="250" font-size="12" fill="#6b6660" text-anchor="end" class="mute">Clean: 10 of 10 pass</text><rect x="330" y="264" width="322" height="58" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="491" y="287" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">Two clean rounds in a row</text><rect x="486.5" y="294" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><rect x="493.1" y="294" width="2.4" height="8" rx="1" fill="#d4674a" opacity="0.7" class="coral-f"/><text x="491" y="316" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.74" class="coral-t">The success exit</text><rect x="28" y="264" width="280" height="58" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" stroke-dasharray="4 3" class="gray-f"/><text x="168" y="287" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">Or a cap of five rounds</text><rect x="153.6" y="294" width="2.4" height="8" rx="1" fill="#b0aca6" opacity="0.7" class="gray-f"/><rect x="160.2" y="294" width="2.4" height="8" rx="1" fill="#b0aca6" opacity="0.7" class="gray-f"/><rect x="166.8" y="294" width="2.4" height="8" rx="1" fill="#b0aca6" opacity="0.7" class="gray-f"/><rect x="173.4" y="294" width="2.4" height="8" rx="1" fill="#b0aca6" opacity="0.7" class="gray-f"/><rect x="180.0" y="294" width="2.4" height="8" rx="1" fill="#b0aca6" opacity="0.7" class="gray-f"/><text x="168" y="316" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.74" class="gray-t">Whichever comes first</text><line x1="491" y1="322" x2="491" y2="346" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="331" y="348" width="320" height="54" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="491.0" y="372.0" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">Status: warm → hot</text><text x="491.0" y="389.0" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.72" class="gray-t">Production deploy is a separate human step</text><line x1="168" y1="322" x2="168" y2="346" stroke="#b0aca6" stroke-width="1.5" opacity="0.7" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="348" width="280" height="54" rx="5" fill="#f4f3f1" stroke="#b0aca6" stroke-width="0.5" class="gray-f"/><text x="168.0" y="372.0" font-size="14" fill="#6b6660" text-anchor="middle" class="gray-t">Escalate</text><text x="168.0" y="389.0" font-size="12" fill="#6b6660" text-anchor="middle" opacity="0.72" class="gray-t">A person decides what happens next</text><line x1="28" y1="428" x2="652" y2="428" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="445" font-size="10" fill="#6b6660" class="mute">The loop ends when two rounds in a row come back clean, or after five rounds, when it stops and hands</text><text x="28" y="458" font-size="10" fill="#6b6660" class="mute">the decision to a person. The human is inside every round twice: first interpreting the failures, then</text><text x="28" y="471" font-size="10" fill="#6b6660" class="mute">approving each edit before it is applied, redeployed and re-run.</text><text x="28" y="488" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - agent-11-sugar-trainer.config.ts, hardening-state.ts (checkTermination),</text><text x="28" y="501" font-size="10" fill="#6b6660" opacity="0.72" class="mute">agent-11-steps.md (Q1, Q2)</text></svg>