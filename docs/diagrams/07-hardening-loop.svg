[data-theme=dark] .mute{fill:#dbd7d2}[data-theme=dark] .rule{stroke:#5b5753}[data-theme=light] .teal-f{fill:#dff4ef;stroke:#228c7e}[data-theme=light] .teal-o{stroke:#228c7e}[data-theme=light] .teal-t{fill:#0f5950}[data-theme=light] .teal-m{fill:#228c7e}[data-theme=light] .teal-h{stroke:#32a091}[data-theme=light] .purple-f{fill:#eeecfd;stroke:#7a70af}[data-theme=light] .purple-o{stroke:#7a70af}[data-theme=light] .purple-t{fill:#4d4671}[data-theme=light] .purple-m{fill:#7a70af}[data-theme=light] .purple-h{stroke:#8b81c5}[data-theme=light] .coral-f{fill:#fdeae4;stroke:#aa6550}[data-theme=light] .coral-o{stroke:#aa6550}[data-theme=light] .coral-t{fill:#6e3f30}[data-theme=light] .coral-m{fill:#aa6550}[data-theme=light] .coral-h{stroke:#c0765f}[data-theme=light] .gray-f{fill:#f2eee9;stroke:#7d7a75}[data-theme=light] .gray-o{stroke:#7d7a75}[data-theme=light] .gray-t{fill:#504c48}[data-theme=light] .gray-m{fill:#7d7a75}[data-theme=light] .gray-h{stroke:#8f8b87}[data-theme=light] .surface{fill:#ffffff}[data-theme=light] .ink{fill:#1d1a17}[data-theme=light] .mute{fill:#66635e}[data-theme=light] .rule{stroke:#c1bdb8}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#228c7e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7a70af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#aa6550" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7d7a75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><rect x="0" y="0" width="680" height="813" fill="#ffffff" class="surface"/><text x="28" y="24" font-size="12" fill="#66635e" letter-spacing="1.1" class="mute mono">DIAGRAM 07</text><text x="28" y="52" font-size="21" fill="#1d1a17" font-weight="600" class="ink">The hardening loop</text><text x="28" y="73" font-size="14" fill="#66635e" class="mute">Promotion requires a proof of convergence.</text><text x="28" y="112" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">ONE HARDENING ROUND, AGAINST STAGING</text><rect x="28" y="170" width="150" height="60" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="103.0" y="197.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Playwright ×10</text><text x="103.0" y="214.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Against staging</text><rect x="186" y="170" width="150" height="60" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="261.0" y="197.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Dedupe</text><text x="261.0" y="214.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Collapse failures</text><rect x="344" y="170" width="150" height="60" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="419.0" y="197.0" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Human Q1 · Q2</text><text x="419.0" y="214.0" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Approves each edit</text><rect x="502" y="170" width="150" height="60" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="577.0" y="197.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Patch, re-run</text><text x="577.0" y="214.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Redeploy, 10× again</text><line x1="178" y1="200" x2="184" y2="200" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="336" y1="200" x2="342" y2="200" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="494" y1="200" x2="500" y2="200" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><path d="M577,170 L577,146 L103,146 L103,168" fill="none" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><text x="340" y="140" font-size="12" fill="#66635e" text-anchor="middle" class="mute">Next round</text><line x1="577" y1="230" x2="577" y2="262" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><text x="569" y="250" font-size="12" fill="#66635e" text-anchor="end" class="mute">Clean: all ten runs pass and no failure is left</text><rect x="28" y="264" width="280" height="58" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="168" y="287" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">A cap of five rounds</text><rect x="153.6" y="294" width="2.4" height="8" rx="0" fill="#7d7a75" class="gray-m"/><rect x="160.2" y="294" width="2.4" height="8" rx="0" fill="#7d7a75" class="gray-m"/><rect x="166.8" y="294" width="2.4" height="8" rx="0" fill="#7d7a75" class="gray-m"/><rect x="173.4" y="294" width="2.4" height="8" rx="0" fill="#7d7a75" class="gray-m"/><rect x="180.0" y="294" width="2.4" height="8" rx="0" fill="#7d7a75" class="gray-m"/><text x="168" y="316" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">plus one per extend, two at most</text><rect x="330" y="264" width="322" height="58" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="491" y="287" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Two clean rounds in a row</text><rect x="486.5" y="294" width="2.4" height="8" rx="0" fill="#aa6550" class="coral-m"/><rect x="493.1" y="294" width="2.4" height="8" rx="0" fill="#aa6550" class="coral-m"/><text x="491" y="316" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">then the declare-hot question</text><line x1="491" y1="322" x2="491" y2="344" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="330" y="346" width="322" height="50" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="491" y="367" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Declare hot?</text><text x="491" y="385" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Asked between rounds; the default is yes</text><path d="M168,322 L168,406 L124,406 L124,426" fill="none" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="491" y1="396" x2="491" y2="412" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="302" y1="412" x2="594" y2="412" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" class="gray-o"/><line x1="302" y1="412" x2="302" y2="426" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="454" y1="412" x2="454" y2="426" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="594" y1="412" x2="594" y2="426" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="428" width="192" height="50" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="124.0" y="450.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">max_iterations</text><text x="124.0" y="467.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">Build-end surfaces it</text><line x1="124.0" y1="478" x2="124.0" y2="496" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="232" y="428" width="140" height="50" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="302.0" y="450.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">yes: hot</text><text x="302.0" y="467.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">warm → hot</text><line x1="302.0" y1="478" x2="302.0" y2="496" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="384" y="428" width="140" height="50" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="454.0" y="450.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">extend</text><text x="454.0" y="467.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">One more round</text><line x1="454.0" y1="478" x2="454.0" y2="496" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="536" y="428" width="116" height="50" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" class="gray-f"/><text x="594.0" y="450.0" font-size="14" fill="#504c48" text-anchor="middle" class="gray-t">stop</text><text x="594.0" y="467.0" font-size="12" fill="#504c48" text-anchor="middle" class="gray-t">human_stop</text><line x1="594.0" y1="478" x2="594.0" y2="496" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="498" width="624" height="50" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="519" font-size="14" fill="#0f5950" class="teal-t">The aggregated handoff</text><text x="634" y="519" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">to learning-close</text><text x="46" y="537" font-size="12" fill="#0f5950" class="teal-t">Every round, with termination_reason and hot_reached from the loop</text><text x="28" y="572" font-size="12" fill="#66635e" class="mute">Production deploy after hot stays a separate human step</text><line x1="28" y1="602" x2="652" y2="602" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="622" font-size="12" fill="#66635e" class="mute">The loop ends hot when two rounds in a row come back clean and the declare-hot</text><text x="28" y="640" font-size="12" fill="#66635e" class="mute">question, which the orchestrator asks between rounds, is answered yes, the</text><text x="28" y="658" font-size="12" fill="#66635e" class="mute">default. Stop ends it there, and extend runs one more round, twice at most. At the</text><text x="28" y="676" font-size="12" fill="#66635e" class="mute">round cap it ends as max_iterations, which build-end surfaces. Within a round the</text><text x="28" y="694" font-size="12" fill="#66635e" class="mute">agent asks a person twice, through the steering tool a build enables: to interpret</text><text x="28" y="712" font-size="12" fill="#66635e" class="mute">the failures, then to approve each edit before it is applied, redeployed and</text><text x="28" y="730" font-size="12" fill="#66635e" class="mute">re-run.</text><text x="28" y="758" font-size="12" fill="#66635e" class="mute">Evidence: shipped - agent-11-sugar-trainer.config.ts, hardening-state.ts</text><text x="28" y="776" font-size="12" fill="#66635e" class="mute">(checkTermination, aggregateHardeningPayload), askDeclareHot in</text><text x="28" y="794" font-size="12" fill="#66635e" class="mute">master-agentic-orchestrator.ts, agent-11-steps.md (Q1, Q2)</text></svg>