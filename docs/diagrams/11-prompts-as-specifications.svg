<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 997" width="100%" role="img" aria-label="Prompts as specifications. A prompt is an artifact with a declared shape, graded before it is used."><style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}text.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Mono','Segoe UI Mono','DejaVu Sans Mono','Liberation Mono',monospace}.num{font-variant-numeric:tabular-nums}@media (prefers-color-scheme:dark){.teal-f{fill:#122925;stroke:#61c2b2}.teal-o{stroke:#61c2b2}.teal-t{fill:#bee8e0}.teal-m{fill:#61c2b2}.teal-h{stroke:#32a091}.purple-f{fill:#242232;stroke:#ada4e6}.purple-o{stroke:#ada4e6}.purple-t{fill:#dddafb}.purple-m{fill:#ada4e6}.purple-h{stroke:#8b81c5}.coral-f{fill:#311f19;stroke:#e39982}.coral-o{stroke:#e39982}.coral-t{fill:#fad5c9}.coral-m{fill:#e39982}.coral-h{stroke:#c0765f}.gray-f{fill:#262421;stroke:#b1ada8}.gray-o{stroke:#b1ada8}.gray-t{fill:#e1ddd8}.gray-m{fill:#b1ada8}.gray-h{stroke:#8f8b87}.surface{fill:#0d0b08}.ink{fill:#ebe7e2}.mute{fill:#dbd7d2}.rule{stroke:#5b5753}}[data-theme=dark] .teal-f{fill:#122925;stroke:#61c2b2}[data-theme=dark] .teal-o{stroke:#61c2b2}[data-theme=dark] .teal-t{fill:#bee8e0}[data-theme=dark] .teal-m{fill:#61c2b2}[data-theme=dark] .teal-h{stroke:#32a091}[data-theme=dark] .purple-f{fill:#242232;stroke:#ada4e6}[data-theme=dark] .purple-o{stroke:#ada4e6}[data-theme=dark] .purple-t{fill:#dddafb}[data-theme=dark] .purple-m{fill:#ada4e6}[data-theme=dark] .purple-h{stroke:#8b81c5}[data-theme=dark] .coral-f{fill:#311f19;stroke:#e39982}[data-theme=dark] .coral-o{stroke:#e39982}[data-theme=dark] .coral-t{fill:#fad5c9}[data-theme=dark] .coral-m{fill:#e39982}[data-theme=dark] .coral-h{stroke:#c0765f}[data-theme=dark] .gray-f{fill:#262421;stroke:#b1ada8}[data-theme=dark] .gray-o{stroke:#b1ada8}[data-theme=dark] .gray-t{fill:#e1ddd8}[data-theme=dark] .gray-m{fill:#b1ada8}[data-theme=dark] .gray-h{stroke:#8f8b87}[data-theme=dark] .surface{fill:#0d0b08}[data-theme=dark] .ink{fill:#ebe7e2}[data-theme=dark] .mute{fill:#dbd7d2}[data-theme=dark] .rule{stroke:#5b5753}[data-theme=light] .teal-f{fill:#dff4ef;stroke:#228c7e}[data-theme=light] .teal-o{stroke:#228c7e}[data-theme=light] .teal-t{fill:#0f5950}[data-theme=light] .teal-m{fill:#228c7e}[data-theme=light] .teal-h{stroke:#32a091}[data-theme=light] .purple-f{fill:#eeecfd;stroke:#7a70af}[data-theme=light] .purple-o{stroke:#7a70af}[data-theme=light] .purple-t{fill:#4d4671}[data-theme=light] .purple-m{fill:#7a70af}[data-theme=light] .purple-h{stroke:#8b81c5}[data-theme=light] .coral-f{fill:#fdeae4;stroke:#aa6550}[data-theme=light] .coral-o{stroke:#aa6550}[data-theme=light] .coral-t{fill:#6e3f30}[data-theme=light] .coral-m{fill:#aa6550}[data-theme=light] .coral-h{stroke:#c0765f}[data-theme=light] .gray-f{fill:#f2eee9;stroke:#7d7a75}[data-theme=light] .gray-o{stroke:#7d7a75}[data-theme=light] .gray-t{fill:#504c48}[data-theme=light] .gray-m{fill:#7d7a75}[data-theme=light] .gray-h{stroke:#8f8b87}[data-theme=light] .surface{fill:#ffffff}[data-theme=light] .ink{fill:#1d1a17}[data-theme=light] .mute{fill:#66635e}[data-theme=light] .rule{stroke:#c1bdb8}</style><defs><marker id="ar-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#228c7e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="teal-o"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7a70af" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="purple-o"/></marker><marker id="ar-coral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#aa6550" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="coral-o"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#7d7a75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="gray-o"/></marker></defs><rect x="0" y="0" width="680" height="997" fill="#ffffff" class="surface"/><text x="28" y="24" font-size="12" fill="#66635e" letter-spacing="1.1" class="mute mono">DIAGRAM 11</text><text x="28" y="52" font-size="21" fill="#1d1a17" font-weight="600" class="ink">Prompts as specifications</text><text x="28" y="73" font-size="14" fill="#66635e" class="mute">A prompt is an artifact with a declared shape, graded before it is used.</text><text x="28" y="112" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">WHAT A PROMPT MUST DECLARE</text><rect x="28" y="132" width="200" height="54" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="128.0" y="156.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Input</text><text x="128.0" y="173.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">What data it is given</text><rect x="236" y="132" width="200" height="54" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="336.0" y="156.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Transformation</text><text x="336.0" y="173.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">What operation it performs</text><rect x="444" y="132" width="208" height="54" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="548.0" y="156.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Output</text><text x="548.0" y="173.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">What result it must return</text><line x1="228" y1="159" x2="234" y2="159" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="436" y1="159" x2="442" y2="159" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><text x="28" y="222" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">SCORED ON FIVE DIMENSIONS; THE SCORE IS THE LOWEST, NEVER THE MEAN</text><rect x="28" y="242" width="116" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="86.0" y="263" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Specificity</text><text x="86.0" y="283" font-size="14" fill="#0f5950" text-anchor="middle" font-weight="500" class="teal-t mono">7.50</text><rect x="155" y="242" width="116" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="213.0" y="263" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Structure</text><text x="213.0" y="283" font-size="14" fill="#0f5950" text-anchor="middle" font-weight="500" class="teal-t mono">7.74</text><rect x="282" y="242" width="116" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="340.0" y="263" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Constraints</text><text x="340.0" y="283" font-size="14" fill="#0f5950" text-anchor="middle" font-weight="500" class="teal-t mono">7.43</text><rect x="409" y="242" width="116" height="52" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="467.0" y="263" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">Completeness</text><text x="467.0" y="283" font-size="14" fill="#6e3f30" text-anchor="middle" font-weight="500" class="coral-t mono">7.19</text><rect x="536" y="242" width="116" height="52" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="594.0" y="263" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Actionability</text><text x="594.0" y="283" font-size="14" fill="#0f5950" text-anchor="middle" font-weight="500" class="teal-t mono">7.37</text><text x="340" y="312" font-size="12" fill="#66635e" text-anchor="middle" class="mute">The lowest dimension is the score. Corpus mean per dimension shown; completeness is the weakest.</text><text x="28" y="360" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">THE FLOOR IS SET BY CONSEQUENCE, NOT BY LENGTH</text><rect x="28" y="380" width="624" height="30" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="46" y="400" font-size="14" fill="#6e3f30" font-weight="500" class="coral-t mono">8.5</text><text x="96" y="400" font-size="12" fill="#6e3f30" class="coral-t">9 surfaces</text><text x="196" y="400" font-size="12" fill="#6e3f30" class="coral-t">System prompts, scorers, adversarial judges, fan-out and HITL questions</text><rect x="28" y="416" width="624" height="30" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" class="coral-f"/><text x="46" y="436" font-size="14" fill="#6e3f30" font-weight="500" class="coral-t mono">8.0</text><text x="96" y="436" font-size="12" fill="#6e3f30" class="coral-t">2 surfaces</text><text x="196" y="436" font-size="12" fill="#6e3f30" class="coral-t">Session dispatch, handoff narrative</text><rect x="28" y="452" width="624" height="30" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="472" font-size="14" fill="#0f5950" font-weight="500" class="teal-t mono">7.5</text><text x="96" y="472" font-size="12" fill="#0f5950" class="teal-t">14 surfaces</text><text x="196" y="472" font-size="12" fill="#0f5950" class="teal-t">Instructions, build prompts, playbooks, step files, CLAUDE.md</text><rect x="28" y="488" width="624" height="30" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="508" font-size="14" fill="#0f5950" font-weight="500" class="teal-t mono">7.0</text><text x="96" y="508" font-size="12" fill="#0f5950" class="teal-t">3 surfaces</text><text x="196" y="508" font-size="12" fill="#0f5950" class="teal-t">MCP tool descriptions, Zod and config descriptions</text><rect x="28" y="524" width="624" height="30" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" stroke-dasharray="5 4" class="gray-f"/><text x="46" y="544" font-size="14" fill="#504c48" font-weight="500" class="gray-t mono">4.0</text><text x="96" y="544" font-size="12" fill="#504c48" class="gray-t">2 surfaces</text><text x="196" y="544" font-size="12" fill="#504c48" class="gray-t">Directory indexes, templates</text><text x="340" y="572" font-size="12" fill="#66635e" text-anchor="middle" class="mute">Thirty declared surfaces. The highest bar sits on the prompts that judge other work.</text><text x="28" y="604" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">BELOW THE FLOOR: ELEVATED ONCE, THEN BLOCKED</text><rect x="28" y="624" width="150" height="54" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="103.0" y="648.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Graded</text><text x="103.0" y="665.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">Against its own floor</text><rect x="186" y="624" width="150" height="54" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="261.0" y="648.0" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Below</text><text x="261.0" y="665.0" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">One automatic rewrite</text><rect x="344" y="624" width="150" height="54" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="419.0" y="648.0" font-size="14" fill="#0f5950" text-anchor="middle" class="teal-t">Re-graded</text><text x="419.0" y="665.0" font-size="12" fill="#0f5950" text-anchor="middle" class="teal-t">The same floor</text><rect x="502" y="624" width="150" height="54" rx="5" fill="#fdeae4" stroke="#aa6550" stroke-width="1.0" stroke-dasharray="5 4" class="coral-f"/><text x="577.0" y="648.0" font-size="14" fill="#6e3f30" text-anchor="middle" class="coral-t">Blocked</text><text x="577.0" y="665.0" font-size="12" fill="#6e3f30" text-anchor="middle" class="coral-t">A second failure stops</text><line x1="178" y1="651" x2="184" y2="651" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="336" y1="651" x2="342" y2="651" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><line x1="494" y1="651" x2="500" y2="651" stroke="#7d7a75" stroke-width="1.75" stroke-linecap="round" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="698" width="624" height="62" rx="5" fill="#f2eee9" stroke="#7d7a75" stroke-width="1.0" stroke-dasharray="5 4" class="gray-f"/><text x="44" y="720" font-size="12" fill="#504c48" font-weight="500" class="gray-t">What this does not reach</text><text x="44" y="738" font-size="12" fill="#504c48" class="gray-t">The score judges a prompt, not the output that prompt produces; nothing here connects the two.</text><text x="44" y="753" font-size="12" fill="#504c48" class="gray-t">313 of 1,116 graded prompts sit below their floor and are in the corpus anyway: the gate holds what passes through it.</text><line x1="28" y1="786" x2="652" y2="786" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="806" font-size="12" fill="#66635e" class="mute">Every prompt the system writes, uses or embeds declares an input, a transformation</text><text x="28" y="824" font-size="12" fill="#66635e" class="mute">and an output, and is scored on five dimensions before it is allowed to run. The</text><text x="28" y="842" font-size="12" fill="#66635e" class="mute">score is the lowest dimension rather than the mean, so a prompt cannot compensate</text><text x="28" y="860" font-size="12" fill="#66635e" class="mute">for being unactionable by being well structured. Each of thirty surfaces carries</text><text x="28" y="878" font-size="12" fill="#66635e" class="mute">its own floor, from 4.0 for a directory index to 8.5 for a scorer or an</text><text x="28" y="896" font-size="12" fill="#66635e" class="mute">adversarial judge: the bar is a claim about consequence. A prompt below its floor</text><text x="28" y="914" font-size="12" fill="#66635e" class="mute">is rewritten once automatically and blocked on a second failure.</text><text x="28" y="942" font-size="12" fill="#66635e" class="mute">Evidence: shipped - craftsmanship-gate.ts, enrich-prompt.ts, SURFACE_FLOORS in</text><text x="28" y="960" font-size="12" fill="#66635e" class="mute">craftsmanship-surface-policy.ts, prompt-multiplier.md; audited - 30 surfaces, 5</text><text x="28" y="978" font-size="12" fill="#66635e" class="mute">floor levels, 1,116 graded prompts of which 313 below floor</text></svg>