 x1="126" y1="274" x2="558" y2="274" stroke="#b0aca6" stroke-width="1.5" opacity="0.55" class="gray-o"/><line x1="342" y1="274" x2="342" y2="292" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="200" y="294" width="280" height="46" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="340" y="315" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">.merge.lock</text><text x="340" y="331" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.72" class="coral-t">Rebase, then fast-forward to trunk</text><line x1="342" y1="342" x2="342" y2="362" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="364" width="624" height="84" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="388" font-size="14" fill="#1f6f65" class="teal-t">Trunk</text><text x="634" y="388" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">15 build agents</text><rect x="539.2" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="545.8" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="552.4" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="559.0" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="565.6" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="572.2" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="578.8" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="585.4" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="592.0" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="598.6" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="605.2" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="611.8" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="618.4" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="625.0" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="631.6" y="398" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><text x="46" y="410" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">Spec Validator · Foundation · API Integration · Collection · Analysis</text><text x="46" y="426" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">Synthesis · Frontend Core · Frontend Intelligence · Admin · Testing</text><text x="46" y="442" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">Browser Testing · Craftsmanship · Deployment · Sugar Trainer · Prompt Manager</text><text x="28" y="468" font-size="12" fill="#a84a30" opacity="0.8" class="coral-t">Human review pauses the chain after Synthesis (gate A) and Frontend Core (gate B)</text><text x="28" y="494" font-size="12" fill="#6b6660" class="mute">Research cluster, opt-in with --include-research</text><rect x="28" y="504" width="624" height="62" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="528" font-size="14" fill="#1f6f65" class="teal-t">Research pipeline</text><text x="634" y="528" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">5 agents</text><rect x="605.2" y="538" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="611.8" y="538" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="618.4" y="538" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="625.0" y="538" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="631.6" y="538" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><text x="46" y="546" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">research-reader · research-graph-builder · research-synthesizer</text><text x="46" y="561" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">marketing-availability-builder · marketing-availability-validator</text><line x1="28" y1="592" x2="652" y2="592" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="609" font-size="10" fill="#6b6660" class="mute">Agents run one at a time in dependency order. Each works in its own git worktree, and its result reaches</text><text x="28" y="622" font-size="10" fill="#6b6660" class="mute">trunk through a rebase and fast-forward under a file lock; human review pauses the chain at two gates.</text><text x="28" y="635" font-size="10" fill="#6b6660" class="mute">The nineteen preflight features are checked by the build-start prompt, a different object from the</text><text x="28" y="648" font-size="10" fill="#6b6660" class="mute">thirty CI gates in verify-all.ts.</text><text x="28" y="665" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - master-agentic-orchestrator.ts (sequential dispatch, worktrees, .merge.lock, gates A</text><text x="28" y="678" font-size="10" fill="#6b6660" opacity="0.72" class="mute">and B); prompts/feature-descriptor.md</text></svg>