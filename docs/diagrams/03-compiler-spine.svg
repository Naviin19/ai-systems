t="20" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="627.96" y="254" font-size="12" fill="#1f6f65" text-anchor="middle" opacity="0.85" class="teal-t">11</text><text x="28" y="304" font-size="12" fill="#6b6660" class="mute">12 waves, at most 2 build agents at once; ORCH_MAX_PARALLEL caps it at 4</text><line x1="340" y1="312" x2="340" y2="332" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="200" y="334" width="280" height="46" rx="5" fill="#fdeeea" stroke="#d4674a" stroke-width="0.5" stroke-dasharray="4 3" class="coral-f"/><text x="340" y="355" font-size="14" fill="#a84a30" text-anchor="middle" class="coral-t">.merge.lock</text><text x="340" y="371" font-size="12" fill="#a84a30" text-anchor="middle" opacity="0.72" class="coral-t">Rebase, then fast-forward to trunk</text><line x1="342" y1="382" x2="342" y2="400" stroke="#b0aca6" stroke-width="1.5" opacity="0.6" marker-end="url(#ar-gray)" class="gray-o"/><rect x="28" y="402" width="624" height="84" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="426" font-size="14" fill="#1f6f65" class="teal-t">Trunk</text><text x="634" y="426" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">15 build agents</text><rect x="539.2" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="545.8" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="552.4" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="559.0" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="565.6" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="572.2" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="578.8" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="585.4" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="592.0" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="598.6" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="605.2" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="611.8" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="618.4" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="625.0" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="631.6" y="436" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><text x="46" y="448" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">Spec Validator · Foundation · API Integration · Collection · Analysis</text><text x="46" y="464" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">Synthesis · Frontend Core · Frontend Intelligence · Admin · Testing</text><text x="46" y="480" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">Browser Testing · Craftsmanship · Deployment · Sugar Trainer · Prompt Manager</text><text x="28" y="506" font-size="12" fill="#a84a30" opacity="0.8" class="coral-t">Gate A after Synthesis and gate B after Frontend Core hold only their dependents</text><text x="28" y="532" font-size="12" fill="#6b6660" class="mute">Research cluster, opt-in with --include-research</text><rect x="28" y="542" width="624" height="62" rx="5" fill="#e8f5f0" stroke="#2d9184" stroke-width="0.5" class="teal-f"/><text x="46" y="566" font-size="14" fill="#1f6f65" class="teal-t">Research pipeline</text><text x="634" y="566" font-size="12" fill="#1f6f65" text-anchor="end" opacity="0.78" class="teal-t">5 agents</text><rect x="605.2" y="576" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="611.8" y="576" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="618.4" y="576" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="625.0" y="576" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><rect x="631.6" y="576" width="2.4" height="9" rx="1" fill="#2d9184" opacity="0.5" class="teal-f"/><text x="46" y="584" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">research-reader · research-graph-builder · research-synthesizer</text><text x="46" y="599" font-size="12" fill="#1f6f65" opacity="0.7" class="teal-t">marketing-availability-builder · marketing-availability-validator</text><line x1="28" y1="630" x2="652" y2="630" stroke="#ddd9d4" stroke-width="0.5" class="rule"/><text x="28" y="647" font-size="10" fill="#6b6660" class="mute">Every agent whose dependencies have finished starts at once, up to four by default, each in its own git</text><text x="28" y="660" font-size="10" fill="#6b6660" class="mute">worktree; this graph lets at most two build agents overlap. Results reach trunk one at a time, through a</text><text x="28" y="673" font-size="10" fill="#6b6660" class="mute">rebase and fast-forward under a file lock, and a human gate holds only the agents that depend on it. The</text><text x="28" y="686" font-size="10" fill="#6b6660" class="mute">nineteen preflight features are run by the build-start prompt, a different object from the</text><text x="28" y="699" font-size="10" fill="#6b6660" class="mute">orchestrator's start gates and from the thirty-three CI gate ids in verify-all.ts.</text><text x="28" y="716" font-size="10" fill="#6b6660" opacity="0.72" class="mute">Evidence: shipped - master-agentic-orchestrator.ts with agent-scheduler.ts, merge-lock.ts,</text><text x="28" y="729" font-size="10" fill="#6b6660" opacity="0.72" class="mute">review-gate.ts and preflight-gate.ts; prompts/feature-descriptor.md; audited - waves from the configs at</text><text x="28" y="742" font-size="10" fill="#6b6660" opacity="0.72" class="mute">5739a97</text></svg>