idth="1.0" class="teal-f"/><text x="46" y="426" font-size="14" fill="#0f5950" class="teal-t">Trunk</text><text x="634" y="426" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">15 build agents</text><rect x="539.2" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="545.8" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="552.4" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="559.0" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="565.6" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="572.2" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="578.8" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="585.4" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="592.0" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="598.6" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="605.2" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="611.8" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="618.4" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="625.0" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="631.6" y="436" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><text x="46" y="448" font-size="12" fill="#0f5950" class="teal-t">Spec Validator · Foundation · API Integration · Collection · Analysis</text><text x="46" y="464" font-size="12" fill="#0f5950" class="teal-t">Synthesis · Frontend Core · Frontend Intelligence · Admin · Testing</text><text x="46" y="480" font-size="12" fill="#0f5950" class="teal-t">Browser Testing · Craftsmanship · Deployment · Sugar Trainer · Prompt Manager</text><text x="28" y="506" font-size="12" fill="#6e3f30" class="coral-t">Gate A after Synthesis and gate B after Frontend Core hold only their dependents</text><text x="28" y="532" font-size="12" fill="#66635e" font-weight="500" letter-spacing="0.9" class="mute mono">RESEARCH CLUSTER, OPT-IN WITH --INCLUDE-RESEARCH</text><rect x="28" y="542" width="624" height="62" rx="5" fill="#dff4ef" stroke="#228c7e" stroke-width="1.0" class="teal-f"/><text x="46" y="566" font-size="14" fill="#0f5950" class="teal-t">Research pipeline</text><text x="634" y="566" font-size="12" fill="#0f5950" text-anchor="end" class="teal-t">5 agents</text><rect x="605.2" y="576" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="611.8" y="576" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="618.4" y="576" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="625.0" y="576" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><rect x="631.6" y="576" width="2.4" height="9" rx="0" fill="#228c7e" class="teal-m"/><text x="46" y="584" font-size="12" fill="#0f5950" class="teal-t">research-reader · research-graph-builder · research-synthesizer</text><text x="46" y="599" font-size="12" fill="#0f5950" class="teal-t">marketing-availability-builder · marketing-availability-validator</text><line x1="28" y1="630" x2="652" y2="630" stroke="#c1bdb8" stroke-width="0.5" class="rule"/><text x="28" y="650" font-size="12" fill="#66635e" class="mute">Every agent whose dependencies have finished starts at once, up to four by</text><text x="28" y="668" font-size="12" fill="#66635e" class="mute">default, each in its own git worktree; this graph lets at most two build agents</text><text x="28" y="686" font-size="12" fill="#66635e" class="mute">overlap. Results reach trunk one at a time, through a rebase and fast-forward</text><text x="28" y="704" font-size="12" fill="#66635e" class="mute">under a file lock, and a human gate holds only the agents that depend on it. The</text><text x="28" y="722" font-size="12" fill="#66635e" class="mute">nineteen preflight features are run by the build-start prompt, a different object</text><text x="28" y="740" font-size="12" fill="#66635e" class="mute">from the orchestrator's start gates and from the thirty-three CI gate ids in</text><text x="28" y="758" font-size="12" fill="#66635e" class="mute">verify-all.ts.</text><text x="28" y="786" font-size="12" fill="#66635e" class="mute">Evidence: shipped - master-agentic-orchestrator.ts with agent-scheduler.ts,</text><text x="28" y="804" font-size="12" fill="#66635e" class="mute">merge-lock.ts, review-gate.ts and preflight-gate.ts;</text><text x="28" y="822" font-size="12" fill="#66635e" class="mute">prompts/feature-descriptor.md; audited - waves from the configs at 5739a97</text></svg>