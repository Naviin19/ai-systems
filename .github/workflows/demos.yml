name: demos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  demos:
    name: Six demos on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Each demo runs the factory's extracted code over its recorded data, with no key and no account.
      - name: npm run demo, with every TCP connection refused
        run: npm run demo
        env:
          NODE_OPTIONS: --require ./tools/no-network.cjs
